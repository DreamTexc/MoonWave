<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Cards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #111;
      color: #eee;
    }
    #stage { position: relative; max-width: 720px; }
    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 16px;
      max-width: 720px;
    }
    .card {
      aspect-ratio: 1;
      border: 1px solid #444;
      border-radius: 10px;
      background: #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .card:hover { border-color: #888; }
    .card.held { border-color: #fc3; }
    .card[data-index="6"] {
      font-size: 12px;
      line-height: 1.35;
      align-items: flex-start;
      padding-top: 12px;
    }
    #geek {
      position: absolute;
      object-fit: cover;
      pointer-events: none;
      z-index: 5;
      border-radius: 10px;
    }
    #geek.flip { transform: scaleX(-1); }
  </style>
</head>
<body>
  <div id="stage">
    <div id="grid"></div>
    <img id="geek" alt="geek" src="geek.png">
  </div>
  <script>
    const TOTAL = 7;
    const grid = document.getElementById('grid');
    const geek = document.getElementById('geek');

    let cardOneHeld = false;
    let walkIndex = 0;
    let walkDir = 1;
    let lastStep = 0;
    const STEP_MS = 900;

    let hitThree = false;
    let tripCount = 0;
    let boxSixWords = '';

    const WORD_BANK = [
      'moon','wave','geek','trace','focus','alpha','lizard','orbit','pulse','signal',
      'vector','quark','nebula','pixel','circuit','phase','drift','echo','flux','node',
      'spark','tidal','zenith','prism','glyph','nova','axiom','helix','ion','radar',
      'sonic','vapor','crystal','ember','forge','haven','ivory','jade','krypton','lunar',
      'magma','nimbus','onyx','plasma','quartz','rift','sable','torque','umbra','vortex',
      'watt','xenon','yield','zephyr','anchor','bridge','cinder','delta','frost'
    ];
    const ONSETS = ['b','c','d','f','g','h','j','k','l','m','n','p','r','s','t','v','w','z','br','cr','dr','fl','gr','st','tr','sk'];
    const NUCLEI = ['a','e','i','o','u','ae','io','ou','ai'];
    const CODAS = ['','n','r','l','s','t','k','m','x','th'];

    function generateRandomWord() {
      if (Math.random() < 0.72) {
        return WORD_BANK[Math.floor(Math.random() * WORD_BANK.length)];
      }
      const a = ONSETS[Math.floor(Math.random() * ONSETS.length)];
      const b = NUCLEI[Math.floor(Math.random() * NUCLEI.length)];
      const c = CODAS[Math.floor(Math.random() * CODAS.length)];
      const extra = Math.random() < 0.35
        ? ONSETS[Math.floor(Math.random() * ONSETS.length)] + NUCLEI[Math.floor(Math.random() * NUCLEI.length)]
        : '';
      return (a + b + c + extra).slice(0, 10);
    }

    function generateFiveWords() {
      const picked = [];
      do {
        const w = generateRandomWord();
        if (picked.indexOf(w) === -1) picked.push(w);
      } while (picked.length < 5);
      return picked;
    }

    geek.onerror = function () {
      this.src = 'https://raw.githubusercontent.com/DreamTexc/MoonWave/main/geek.png';
    };

    function cardContent(index) {
      switch (index) {
        case 0: return '0';
        case 1: return '1';
        case 2: return '2';
        case 3: return '3';
        case 4: return '4';
        case 5: return '5';
        case 6: return boxSixWords;
        default: return '';
      }
    }

    function paintBoxSix() {
      const el = document.querySelector('[data-index="6"]');
      if (el) el.textContent = boxSixWords;
    }

    function enforceTrip(prev, next) {
      do {
        if (next === 3) hitThree = true;
        if (next === 0 && hitThree) {
          tripCount += 1;
          hitThree = false;
          boxSixWords = generateFiveWords().join('\n');
          paintBoxSix();
        }
      } while (false);
    }

    function onCardClick(index) {
      switch (index) {
        case 1:
          cardOneHeld = !cardOneHeld;
          document.querySelector('[data-index="1"]').classList.toggle('held', cardOneHeld);
          break;
        default:
          console.log('clicked', index);
          break;
      }
    }

    function render() {
      grid.innerHTML = '';
      for (let i = 0; i < TOTAL; i++) {
        const el = document.createElement('div');
        el.className = 'card';
        el.dataset.index = i;
        el.textContent = cardContent(i);
        el.addEventListener('click', () => onCardClick(i));
        grid.appendChild(el);
      }
    }

    function fillCard(index) {
      const el = document.querySelector('[data-index="' + index + '"]');
      const stage = document.getElementById('stage').getBoundingClientRect();
      const r = el.getBoundingClientRect();
      geek.style.left = (r.left - stage.left) + 'px';
      geek.style.top = (r.top - stage.top) + 'px';
      geek.style.width = r.width + 'px';
      geek.style.height = r.height + 'px';
      geek.classList.toggle('flip', walkDir < 0);
    }

    function tick(now) {
      if (!cardOneHeld) {
        if (now - lastStep >= STEP_MS) {
          lastStep = now;
          const prev = walkIndex;
          walkIndex += walkDir;
          if (walkIndex >= 3) { walkIndex = 3; walkDir = -1; }
          if (walkIndex <= 0) { walkIndex = 0; walkDir = 1; }
          enforceTrip(prev, walkIndex);
        }
        fillCard(walkIndex);
      }
      requestAnimationFrame(tick);
    }

    render();
    requestAnimationFrame((now) => {
      lastStep = now;
      fillCard(0);
      tick(now);
    });
  </script>
</body>
</html>
