<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Cards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #111;
      color: #eee;
    }
    #stage { position: relative; max-width: 720px; }
    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 16px;
      max-width: 720px;
    }
    .card {
      aspect-ratio: 1;
      border: 1px solid #444;
      border-radius: 10px;
      background: #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .card:hover { border-color: #888; }
    .card.held { border-color: #fc3; }
    .card[data-index="4"] { padding: 0; }
    .card[data-index="5"] { padding: 0; background: #15202b; }
    .card[data-index="6"] {
      font-size: 12px;
      line-height: 1.35;
      align-items: flex-start;
      padding-top: 12px;
    }
    #ice {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 10px;
      pointer-events: none;
    }
    #dimpleCanvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 10px;
    }
    #geek {
      position: absolute;
      object-fit: cover;
      pointer-events: none;
      z-index: 5;
      border-radius: 10px;
    }
    #geek.flip { transform: scaleX(-1); }
  </style>
</head>
<body>
  <div id="stage">
    <div id="grid"></div>
    <img id="geek" alt="geek" src="geek.png">
  </div>
  <script>
    const TOTAL = 7;
    const grid = document.getElementById('grid');
    const geek = document.getElementById('geek');

    let cardOneHeld = false;
    let walkIndex = 0;
    let walkDir = 1;
    let lastStep = 0;
    const STEP_MS = 900;

    let hitThree = false;
    let tripCount = 0;
    let boxSixWords = '';

    const WORD_BANK = [
      'moon','wave','geek','trace','focus','alpha','lizard','orbit','pulse','signal',
      'vector','quark','nebula','pixel','circuit','phase','drift','echo','flux','node',
      'spark','tidal','zenith','prism','glyph','nova','axiom','helix','ion','radar',
      'sonic','vapor','crystal','ember','forge','haven','ivory','jade','krypton','lunar',
      'magma','nimbus','onyx','plasma','quartz','rift','sable','torque','umbra','vortex',
      'watt','xenon','yield','zephyr','anchor','bridge','cinder','delta','frost'
    ];
    const ONSETS = ['b','c','d','f','g','h','j','k','l','m','n','p','r','s','t','v','w','z','br','cr','dr','fl','gr','st','tr','sk'];
    const NUCLEI = ['a','e','i','o','u','ae','io','ou','ai'];
    const CODAS = ['','n','r','l','s','t','k','m','x','th'];

    const dimple = { x: 0.5, y: 0.5, rings: [], lastDrop: 0, dropEvery: 1600 };

    function generateRandomWord() {
      if (Math.random() < 0.72) {
        return WORD_BANK[Math.floor(Math.random() * WORD_BANK.length)];
      }
      const a = ONSETS[Math.floor(Math.random() * ONSETS.length)];
      const b = NUCLEI[Math.floor(Math.random() * NUCLEI.length)];
      const c = CODAS[Math.floor(Math.random() * CODAS.length)];
      const extra = Math.random() < 0.35
        ? ONSETS[Math.floor(Math.random() * ONSETS.length)] + NUCLEI[Math.floor(Math.random() * NUCLEI.length)]
        : '';
      return (a + b + c + extra).slice(0, 10);
    }

    function generateFiveWords() {
      const picked = [];
      do {
        const w = generateRandomWord();
        if (picked.indexOf(w) === -1) picked.push(w);
      } while (picked.length < 5);
      return picked;
    }

    geek.onerror = function () {
      this.src = 'https://raw.githubusercontent.com/DreamTexc/MoonWave/main/geek.png';
    };

    function cardContent(index) {
      switch (index) {
        case 0: return '0';
        case 1: return '1';
        case 2: return '2';
        case 3: return '3';
        case 4: return '';
        case 5: return '';
        case 6: return boxSixWords;
        default: return '';
      }
    }

    function paintBoxSix() {
      const el = document.querySelector('[data-index="6"]');
      if (el) el.textContent = boxSixWords;
    }

    function enforceTrip(prev, next) {
      do {
        if (next === 3) hitThree = true;
        if (next === 0 && hitThree) {
          tripCount += 1;
          hitThree = false;
          boxSixWords = generateFiveWords().join('\n');
          paintBoxSix();
        }
      } while (false);
    }

    function onCardClick(index) {
      switch (index) {
        case 1:
          cardOneHeld = !cardOneHeld;
          document.querySelector('[data-index="1"]').classList.toggle('held', cardOneHeld);
          break;
        case 5:
          doWaterRipple();
          break;
        default:
          console.log('clicked', index);
          break;
      }
    }

    function render() {
      grid.innerHTML = '';
      for (let i = 0; i < TOTAL; i++) {
        const el = document.createElement('div');
        el.className = 'card';
        el.dataset.index = i;
        if (i === 4) {
          const ice = document.createElement('img');
          ice.id = 'ice';
          ice.alt = 'ice';
          ice.src = 'ice.png';
          ice.onerror = function () {
            this.src = 'https://raw.githubusercontent.com/DreamTexc/MoonWave/main/ice.png';
          };
          el.appendChild(ice);
        } else if (i === 5) {
          const canvas = document.createElement('canvas');
          canvas.id = 'dimpleCanvas';
          el.appendChild(canvas);
        } else {
          el.textContent = cardContent(i);
        }
        el.addEventListener('click', () => onCardClick(i));
        grid.appendChild(el);
      }
      sizeDimpleCanvas();
    }

    function sizeDimpleCanvas() {
      const canvas = document.getElementById('dimpleCanvas');
      if (!canvas) return;
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(r.width * dpr));
      canvas.height = Math.max(1, Math.floor(r.height * dpr));
    }

    function doWaterRipple(at) {
      const canvas = document.getElementById('dimpleCanvas');
      if (!canvas) return;
      dimple.rings.push({
        x: at && at.x != null ? at.x : dimple.x,
        y: at && at.y != null ? at.y : dimple.y,
        r: 2,
        max: Math.min(canvas.width, canvas.height) * 0.42,
        life: 1
      });
    }

    function drawDimple(now) {
      const canvas = document.getElementById('dimpleCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.fillStyle = '#15202b';
      ctx.fillRect(0, 0, w, h);
      const gx = dimple.x * w;
      const gy = dimple.y * h;
      const sheen = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.min(w, h) * 0.55);
      sheen.addColorStop(0, 'rgba(170,210,230,0.10)');
      sheen.addColorStop(1, 'rgba(21,32,43,0)');
      ctx.fillStyle = sheen;
      ctx.fillRect(0, 0, w, h);
      ctx.beginPath();
      ctx.arc(gx, gy, Math.max(2, Math.min(w, h) * 0.018), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(210,230,240,0.22)';
      ctx.fill();
      if (now - dimple.lastDrop >= dimple.dropEvery) {
        dimple.lastDrop = now;
        doWaterRipple();
      }
      for (let i = dimple.rings.length - 1; i >= 0; i--) {
        const ring = dimple.rings[i];
        ring.r += Math.max(0.35, Math.min(w, h) * 0.0045);
        ring.life -= 0.012;
        if (ring.life <= 0 || ring.r > ring.max) {
          dimple.rings.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(ring.x * w, ring.y * h, ring.r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(190,220,235,' + (0.22 * ring.life) + ')';
        ctx.lineWidth = Math.max(0.6, 1.4 * ring.life);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ring.x * w, ring.y * h, ring.r * 0.72, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.08 * ring.life) + ')';
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }

    function fillCard(index) {
      const el = document.querySelector('[data-index="' + index + '"]');
      const stage = document.getElementById('stage').getBoundingClientRect();
      const r = el.getBoundingClientRect();
      geek.style.left = (r.left - stage.left) + 'px';
      geek.style.top = (r.top - stage.top) + 'px';
      geek.style.width = r.width + 'px';
      geek.style.height = r.height + 'px';
      geek.classList.toggle('flip', walkDir < 0);
    }

    function tick(now) {
      drawDimple(now);
      if (!cardOneHeld) {
        if (now - lastStep >= STEP_MS) {
          lastStep = now;
          const prev = walkIndex;
          walkIndex += walkDir;
          if (walkIndex >= 3) { walkIndex = 3; walkDir = -1; }
          if (walkIndex <= 0) { walkIndex = 0; walkDir = 1; }
          enforceTrip(prev, walkIndex);
        }
        fillCard(walkIndex);
      }
      requestAnimationFrame(tick);
    }

    window.addEventListener('resize', sizeDimpleCanvas);
    render();
    requestAnimationFrame((now) => {
      lastStep = now;
      dimple.lastDrop = now;
      fillCard(0);
      tick(now);
    });
  </script>
</body>
</html>
