<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4x4 Cards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #111;
      color: #eee;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 16px;
      max-width: 720px;
    }

    .card {
      aspect-ratio: 1;
      border: 1px solid #444;
      border-radius: 10px;
      background: #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .card:hover { border-color: #888; }
  </style>
</head>
<body>

  <div id="grid"></div>

  <script>
    const TOTAL = 16;
    const grid = document.getElementById('grid');

    // change this later if you want a shared mode
    let mode = 'default';

    function cardContent(index) {
      switch (index) {
        case 0:  return '0';
        case 1:  return '1';
        case 2:  return '2';
        case 3:  return '3';
        case 4:  return '4';
        case 5:  return '5';
        case 6:  return '6';
        case 7:  return '7';
        case 8:  return '8';
        case 9:  return '9';
        case 10: return '10';
        case 11: return '11';
        case 12: return '12';
        case 13: return '13';
        case 14: return '14';
        case 15: return '15';
        default: return '?';
      }
    }

    function onCardClick(index) {
      switch (index) {
        case 0:
        case 1:
        case 2:
        case 3:
        case 4:
        case 5:
        case 6:
        case 7:
        case 8:
        case 9:
        case 10:
        case 11:
        case 12:
        case 13:
        case 14:
        case 15:
          console.log('clicked', index);
          break;
        default:
          break;
      }
    }

    function render() {
      grid.innerHTML = '';
      for (let i = 0; i < TOTAL; i++) {
        const el = document.createElement('div');
        el.className = 'card';
        el.dataset.index = i;
        el.textContent = cardContent(i);
        el.addEventListener('click', () => onCardClick(i));
        grid.appendChild(el);
      }
    }

    render();
  </script>
</body>
</html>
