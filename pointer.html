<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Cards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; background: #07070b; perspective: 1100px; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% 120%, #1a1a24 0%, #07070b 62%);
      color: #eee;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #sheet {
      position: relative;
      max-width: 760px;
      margin: 36px 24px 80px;
      padding-bottom: 10px;
      transform: perspective(900px) rotateX(7deg) translateY(-8px);
      transform-origin: center top;
      filter: drop-shadow(0 28px 34px rgba(0,0,0,.55));
      transition: transform 800ms ease, filter 800ms ease;
    }
    #sheet::before, #sheet::after {
      content: '';
      position: absolute;
      top: 8px; bottom: 18px; width: 28px;
      pointer-events: none; z-index: 8;
    }
    #sheet::before {
      left: -10px;
      background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,0));
      transform: perspective(400px) rotateY(18deg);
      border-radius: 18px 0 0 22px;
    }
    #sheet::after {
      right: -10px;
      background: linear-gradient(270deg, rgba(0,0,0,.35), rgba(0,0,0,0));
      transform: perspective(400px) rotateY(-18deg);
      border-radius: 0 18px 22px 0;
    }
    body.float-opaque #sheet {
      transform: perspective(900px) rotateX(12deg) translateY(-22px) scale(1.02);
      filter: drop-shadow(0 48px 50px rgba(0,0,0,.7));
    }
    #reflection {
      position: fixed; left: 0; right: 0; top: 42%; height: 58%;
      pointer-events: none; z-index: 6; opacity: 0.18;
      transform: scaleY(-1); filter: blur(6px) brightness(1.2);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.35), transparent 70%);
    }
    #dotPatch { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
    #stage {
      position: relative; max-width: 720px; z-index: 2;
      background: #111; border-radius: 12px;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px; padding: 16px; max-width: 720px;
    }
    .card {
      aspect-ratio: 1; border: 1px solid #444; border-radius: 10px;
      background: #1c1c1c; display: flex; align-items: center;
      justify-content: center; text-align: center; padding: 8px;
      font-size: 14px; cursor: pointer; user-select: none;
      position: relative; overflow: hidden;
    }
    .card:hover { border-color: #888; }
    .card.held { border-color: #fc3; }
    .card[data-index="4"] { padding: 0; }
    .card[data-index="5"] { padding: 0; background: #15202b; }
    .card[data-index="6"] {
      font-size: 12px; line-height: 1.35;
      align-items: stretch; justify-content: flex-start;
      padding: 8px; flex-direction: column;
      overflow: visible; z-index: 15;
    }
    .hot-label { font-size: 9px; letter-spacing: 0.16em; color: #f4b44a; margin-bottom: 4px; }
    .hot-word { display: block; width: 100%; text-align: left; color: #eee; cursor: pointer; }
    .hot-word:hover { color: #f4b44a; }
    #hotDrop {
      display: none; position: absolute; left: 0; right: 0; top: 100%;
      margin-top: 4px; background: #161616; border: 1px solid #666;
      border-radius: 8px; padding: 8px; z-index: 40;
      box-shadow: 0 10px 24px rgba(0,0,0,.45);
    }
    #hotDrop.open { display: block; }
    #hotDrop .info { font-size: 10px; color: #aaa; margin-bottom: 6px; }
    #hotDrop a { display: block; color: #cfe7ff; text-decoration: none; font-size: 11px; padding: 4px 0; border-top: 1px solid #2a2a2a; }
    #ice, #dimpleCanvas { width: 100%; height: 100%; display: block; border-radius: 10px; }
    #geek { position: absolute; object-fit: cover; pointer-events: none; z-index: 12; border-radius: 10px; }
    #geek.flip { transform: scaleX(-1); }

    #under-box-3 {
      margin: 0 16px 12px;
      padding: 10px;
      border: 1px solid #3a3a48;
      border-radius: 10px;
      background: #16161c;
    }
    #under-box-3 .caption {
      font-size: 10px; letter-spacing: .14em; color: #f4b44a; margin-bottom: 6px;
    }
    .dpad {
      display: grid;
      grid-template-columns: 44px 44px 44px;
      grid-template-rows: 44px 44px 44px;
      gap: 4px;
      width: max-content;
    }
    .dpad button {
      border: 1px solid #555;
      background: #222;
      color: #eee;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .dpad button:hover { border-color: #aaa; }
    .dpad .up    { grid-column: 2; grid-row: 1; }
    .dpad .left  { grid-column: 1; grid-row: 2; }
    .dpad .mid   { grid-column: 2; grid-row: 2; font-size: 9px; letter-spacing: .08em; color: #f4b44a; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down  { grid-column: 2; grid-row: 3; }
    #loop-log, #live-info {
      margin-top: 8px; font-size: 11px; color: #bbb; white-space: pre-wrap;
    }
    #live-info {
      background: #0d0d12; border: 1px solid #333; border-radius: 8px; padding: 8px;
      max-height: 140px; overflow: auto; font-family: ui-monospace, Consolas, monospace;
    }
    .ratio-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      margin-top: 8px; font-size: 12px; color: #ccc;
    }
    .ratio-row input[type="number"] {
      width: 64px; background: #0d0d12; color: #eee;
      border: 1px solid #444; border-radius: 6px; padding: 4px 6px;
    }
    table.singleton-wrap {
      width: calc(100% - 32px);
      margin: 0 16px 14px;
      border-collapse: collapse;
    }
    table.singleton-wrap td {
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px;
      background: #15151b;
      text-align: center;
    }
    #correct-feedback {
      background: #f4b44a; color: #111; border: 0; border-radius: 8px;
      padding: 8px 14px; font-weight: 700; cursor: pointer;
    }
    #user-code {
      width: 100%; min-height: 72px; margin-top: 8px;
      background: #0d0d12; color: #d8d8e0; border: 1px solid #333;
      border-radius: 8px; padding: 8px; font: 12px ui-monospace, Consolas, monospace;
    }
    #check-result { display: block; margin-top: 6px; font-size: 12px; color: #aaa; white-space: pre-wrap; text-align: left; }
    #curveCanvas {
      width: 100%; height: 260px; display: block;
      background: #0a0c12; border: 1px solid #333; border-radius: 8px; margin-top: 8px;
    }
    #eq-line { font: 12px ui-monospace, Consolas, monospace; color: #cfe7ff; margin-top: 6px; text-align: left; }
  </style>
</head>
<body>
  <canvas id="dotPatch"></canvas>
  <div id="reflection"></div>
  <div id="sheet">
    <div id="stage">
      <div id="grid"></div>
      <img id="geek" alt="geek" src="geek.png">

      <div id="under-box-3">
        <div class="caption">UNDER BOX 3 · INFO LOOP · RATIO</div>
        <div class="dpad">
          <button class="up" data-dir="up" type="button">▲</button>
          <button class="left" data-dir="left" type="button">◀</button>
          <button class="mid" id="reset-info" type="button">INFO</button>
          <button class="right" data-dir="right" type="button">▶</button>
          <button class="down" data-dir="down" type="button">▼</button>
        </div>
        <div class="ratio-row">
          <label>p <input id="ratio-p" type="number" value="2" min="1" max="12" step="1"></label>
          <label>q <input id="ratio-q" type="number" value="3" min="1" max="12" step="1"></label>
          <span id="ratio-readout">p/q = 2/3</span>
        </div>
        <div id="loop-log">Click a direction. Object 2.info is a copy — Object 1 stays original. Ratio drives the live curve.</div>
        <div id="live-info"></div>
      </div>

      <table class="singleton-wrap">
        <tr>
          <td>
            <button id="correct-feedback" type="button">Correct Feedback → Space Curve</button>
            <div id="eq-line">x = f(t), y = g(t), z = h(t)</div>
            <canvas id="curveCanvas" width="640" height="260"></canvas>
            <div id="check-result">singleton math viz · waiting</div>
            <textarea id="user-code" placeholder="insert relevant info: note, phase, scale…">note: torus knot from inheritance ratio
phase: 0
scale: 1</textarea>
          </td>
        </tr>
      </table>
    </div>
  </div>
  <script>
    const TOTAL = 7;
    const grid = document.getElementById('grid');
    const geek = document.getElementById('geek');
    const dotPatch = document.getElementById('dotPatch');
    const reflection = document.getElementById('reflection');
    let cardOneHeld = false, walkIndex = 0, walkDir = 1, lastStep = 0;
    const STEP_MS = 900;
    let hitThree = false, tripCount = 0, zeroHits = 0, moveCount = 0;
    let boxSixWords = '', opaqueLevel = 0;
    const WORD_BANK = ['moon','wave','geek','trace','focus','alpha','lizard','orbit','pulse','signal','vector','quark','nebula','pixel','circuit','phase','drift','echo','flux','node','spark','tidal','zenith','prism','glyph','nova','axiom','helix','ion','radar','sonic','vapor','crystal','ember','forge','haven','ivory','jade','krypton','lunar','magma','nimbus','onyx','plasma','quartz','rift','sable','torque','umbra','vortex','watt','xenon','yield','zephyr','anchor','bridge','cinder','delta','frost'];
    const ONSETS = ['b','c','d','f','g','h','j','k','l','m','n','p','r','s','t','v','w','z','br','cr','dr','fl','gr','st','tr','sk'];
    const NUCLEI = ['a','e','i','o','u','ae','io','ou','ai'];
    const CODAS = ['','n','r','l','s','t','k','m','x','th'];
    const dimple = { x: 0.5, y: 0.5, rings: [], lastDrop: 0, dropEvery: 1600 };
    function generateRandomWord() {
      if (Math.random() < 0.72) return WORD_BANK[Math.floor(Math.random() * WORD_BANK.length)];
      return (ONSETS[Math.floor(Math.random()*ONSETS.length)] + NUCLEI[Math.floor(Math.random()*NUCLEI.length)] + CODAS[Math.floor(Math.random()*CODAS.length)]).slice(0,10);
    }
    function generateFiveWords() {
      const picked = [];
      do { const w = generateRandomWord(); if (picked.indexOf(w) === -1) picked.push(w); } while (picked.length < 5);
      return picked;
    }
    geek.onerror = function () { this.src = 'https://raw.githubusercontent.com/DreamTexc/MoonWave/main/geek.png'; };
    function paintBoxSix() {
      const el = document.querySelector('[data-index="6"]');
      if (!el) return;
      el.innerHTML = '';
      const label = document.createElement('div');
      label.className = 'hot-label';
      label.textContent = 'HOT';
      el.appendChild(label);
      const words = boxSixWords ? boxSixWords.split('\n').filter(Boolean) : [];
      words.forEach((word) => {
        const row = document.createElement('span');
        row.className = 'hot-word';
        row.textContent = word;
        row.addEventListener('click', function (e) { e.stopPropagation(); openHotSearch(word, el); });
        el.appendChild(row);
      });
      let drop = document.getElementById('hotDrop');
      if (!drop) { drop = document.createElement('div'); drop.id = 'hotDrop'; }
      el.appendChild(drop);
    }
    async function generateSearchResults(word) {
      const q = word || generateRandomWord();
      const query = encodeURIComponent(q);
      try {
        const res = await fetch('https://en.wikipedia.org/w/api.php?action=opensearch&limit=3&namespace=0&origin=*&search=' + query);
        const data = await res.json();
        const out = [];
        for (let i = 0; i < Math.min(3, (data[1] || []).length); i++) out.push({ title: data[1][i], href: data[3][i] });
        while (out.length < 3) out.push({ title: q + ' — Google ' + (out.length + 1), href: 'https://www.google.com/search?q=' + query });
        return { word: q, results: out.slice(0, 3) };
      } catch (err) {
        return { word: q, results: [
          { title: q + ' result 1', href: 'https://www.google.com/search?q=' + query },
          { title: q + ' result 2', href: 'https://www.google.com/search?q=' + query + '+wiki' },
          { title: q + ' result 3', href: 'https://www.google.com/search?q=' + query + '+meaning' }
        ]};
      }
    }
    async function openHotSearch(word, box) {
      const drop = document.getElementById('hotDrop') || document.createElement('div');
      drop.id = 'hotDrop';
      box.appendChild(drop);
      drop.classList.add('open');
      drop.innerHTML = '<div class="info">info · searching ' + word + '</div>';
      const pack = await generateSearchResults(word);
      drop.innerHTML = '<div class="info">info · ' + pack.word + '</div>';
      pack.results.forEach((item, i) => {
        const a = document.createElement('a');
        a.href = item.href; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = (i + 1) + '. ' + item.title;
        drop.appendChild(a);
      });
    }
    function onCardClick(index) {
      switch (index) {
        case 1:
          cardOneHeld = !cardOneHeld;
          document.querySelector('[data-index="1"]').classList.toggle('held', cardOneHeld);
          break;
        case 5: doWaterRipple(); break;
        case 6: {
          const words = boxSixWords ? boxSixWords.split('\n').filter(Boolean) : [];
          openHotSearch(words[0] || generateRandomWord(), document.querySelector('[data-index="6"]'));
          break;
        }
        default: console.log('clicked', index);
      }
    }
    function enforceTrip(prev, next) {
      do {
        if (next === 3) hitThree = true;
        if (next === 0 && hitThree) {
          tripCount += 1; zeroHits += 1; hitThree = false;
          boxSixWords = generateFiveWords().join('\n');
          paintBoxSix();
          if (zeroHits % 2 === 0) setTimeout(function(){ document.body.classList.add('float-opaque'); setTimeout(function(){ document.body.classList.remove('float-opaque'); }, 2200); }, 80);
        }
      } while (false);
    }
    function render() {
      grid.innerHTML = '';
      for (let i = 0; i < TOTAL; i++) {
        const el = document.createElement('div');
        el.className = 'card';
        el.dataset.index = i;
        if (i === 4) {
          const ice = document.createElement('img'); ice.id = 'ice'; ice.src = 'ice.png';
          ice.onerror = function () { this.src = 'https://raw.githubusercontent.com/DreamTexc/MoonWave/main/ice.png'; };
          el.appendChild(ice);
        } else if (i === 5) {
          const canvas = document.createElement('canvas'); canvas.id = 'dimpleCanvas'; el.appendChild(canvas);
        } else el.textContent = i === 6 ? '' : String(i);
        el.addEventListener('click', () => onCardClick(i));
        grid.appendChild(el);
      }
      paintBoxSix();
    }
    function sizeDimpleCanvas() {
      const canvas = document.getElementById('dimpleCanvas'); if (!canvas) return;
      const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(r.width * dpr));
      canvas.height = Math.max(1, Math.floor(r.height * dpr));
    }
    function doWaterRipple() {
      const canvas = document.getElementById('dimpleCanvas'); if (!canvas) return;
      dimple.rings.push({ x: 0.5, y: 0.5, r: 2, max: Math.min(canvas.width, canvas.height) * 0.42, life: 1 });
    }
    function drawDimple(now) {
      const canvas = document.getElementById('dimpleCanvas'); if (!canvas) return;
      const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
      ctx.fillStyle = '#15202b'; ctx.fillRect(0,0,w,h);
      if (now - dimple.lastDrop >= dimple.dropEvery) { dimple.lastDrop = now; doWaterRipple(); }
      for (let i = dimple.rings.length - 1; i >= 0; i--) {
        const ring = dimple.rings[i];
        ring.r += Math.max(0.35, Math.min(w,h)*0.0045); ring.life -= 0.012;
        if (ring.life <= 0 || ring.r > ring.max) { dimple.rings.splice(i,1); continue; }
        ctx.beginPath(); ctx.arc(ring.x*w, ring.y*h, ring.r, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(190,220,235,' + (0.22*ring.life) + ')'; ctx.stroke();
      }
    }
    function fillCard(index) {
      const stageEl = document.getElementById('stage');
      const el = stageEl.querySelector('[data-index="' + index + '"]'); if (!el) return;
      const stage = stageEl.getBoundingClientRect(), r = el.getBoundingClientRect();
      const sx = stage.width / stageEl.offsetWidth || 1, sy = stage.height / stageEl.offsetHeight || 1;
      geek.style.left = ((r.left-stage.left)/sx)+'px';
      geek.style.top = ((r.top-stage.top)/sy)+'px';
      geek.style.width = (r.width/sx)+'px';
      geek.style.height = (r.height/sy)+'px';
      geek.classList.toggle('flip', walkDir < 0);
    }
    function tick(now) {
      drawDimple(now);
      if (!cardOneHeld) {
        if (now - lastStep >= STEP_MS) {
          lastStep = now;
          const prev = walkIndex;
          walkIndex += walkDir;
          if (walkIndex >= 3) { walkIndex = 3; walkDir = -1; }
          if (walkIndex <= 0) { walkIndex = 0; walkDir = 1; }
          moveCount += 1;
          enforceTrip(prev, walkIndex);
        }
        fillCard(walkIndex);
      }
      var viz = SpaceCurve.getInstance();
      viz.draw(now);
      requestAnimationFrame(tick);
    }
    function patchScreenDots() {
      const dpr = window.devicePixelRatio || 1;
      dotPatch.width = Math.floor(innerWidth*dpr); dotPatch.height = Math.floor(innerHeight*dpr);
      const ctx = dotPatch.getContext('2d'); ctx.clearRect(0,0,dotPatch.width,dotPatch.height);
      for (let i = 0; i < 28; i++) {
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.beginPath(); ctx.arc(Math.random()*dotPatch.width, Math.random()*dotPatch.height, 0.7*dpr, 0, Math.PI*2); ctx.fill();
      }
    }

    function InfoSource(label) {
      this.label = label;
      this.info = { heading: 'N', message: 'source template — do not mutate', ticks: 0, p: 2, q: 3 };
    }
    function InfoChild(label, source) {
      InfoSource.call(this, label);
      this.info = Object.assign({}, source.info, {
        message: 'working copy — user may change this',
        inheritedFrom: source.label
      });
    }
    var object1 = new InfoSource('Object 1');
    var object2 = new InfoChild('Object 2', object1);
    var object3 = new InfoSource('Object 3');

    function syncRatioFromInputs() {
      var p = Math.max(1, parseInt(document.getElementById('ratio-p').value, 10) || 2);
      var q = Math.max(1, parseInt(document.getElementById('ratio-q').value, 10) || 3);
      object2.info.p = p;
      object2.info.q = q;
      document.getElementById('ratio-readout').textContent = 'p/q = ' + p + '/' + q;
    }
    function renderLiveInfo() {
      var el = document.getElementById('live-info');
      if (!el) return;
      el.textContent =
        object1.label + '.info (original):\n' + JSON.stringify(object1.info, null, 2) +
        '\n\n' + object2.label + '.info (copy / live ratio):\n' + JSON.stringify(object2.info, null, 2) +
        '\n\n' + object3.label + '.info:\n' + JSON.stringify(object3.info, null, 2);
    }
    var headings = ['N', 'E', 'S', 'W'];
    function applyDirection(dir) {
      object2.info.ticks += 1;
      var idx = headings.indexOf(object2.info.heading);
      if (idx < 0) idx = 0;
      if (dir === 'left') idx = (idx + 3) % 4;
      else if (dir === 'right') idx = (idx + 1) % 4;
      else if (dir === 'down') idx = (idx + 2) % 4;
      object2.info.heading = headings[idx];
      object2.info.message = 'loop #' + object2.info.ticks + ' via ' + dir + ' → ' + object2.info.heading;
      document.getElementById('loop-log').textContent =
        'Feedback on Object 2 only. Ratio p/q and heading drive x=f(t), y=g(t), z=h(t).';
      renderLiveInfo();
    }
    document.querySelectorAll('.dpad button[data-dir]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        applyDirection(btn.getAttribute('data-dir'));
      });
    });
    document.getElementById('reset-info').addEventListener('click', function (e) {
      e.stopPropagation();
      var p = object2.info.p, q = object2.info.q;
      object2.info = Object.assign({}, object1.info, {
        message: 'working copy reset from Object 1',
        inheritedFrom: object1.label,
        p: p,
        q: q
      });
      document.getElementById('loop-log').textContent = 'Reset copy from Object 1. Original untouched.';
      renderLiveInfo();
    });
    document.getElementById('ratio-p').addEventListener('input', function () { syncRatioFromInputs(); renderLiveInfo(); });
    document.getElementById('ratio-q').addEventListener('input', function () { syncRatioFromInputs(); renderLiveInfo(); });

    var SpaceCurve = (function () {
      var instance;
      function parseInsert(text) {
        var phase = 0, scale = 1, note = '';
        String(text || '').split(/\n/).forEach(function (line) {
          var m = line.match(/^\s*phase\s*:\s*([-0-9.]+)/i);
          if (m) phase = parseFloat(m[1]) || 0;
          m = line.match(/^\s*scale\s*:\s*([-0-9.]+)/i);
          if (m) scale = parseFloat(m[1]) || 1;
          m = line.match(/^\s*note\s*:\s*(.+)/i);
          if (m) note = m[1];
        });
        return { phase: phase, scale: scale, note: note };
      }
      function headingAngle(h) {
        return ({ N: 0, E: Math.PI / 2, S: Math.PI, W: 3 * Math.PI / 2 }[h] || 0);
      }
      function create() {
        return {
          name: 'Correct Feedback',
          kind: 'space-curve',
          f: function (t, p, q, R, r, phase) {
            return (R + r * Math.cos(q * t + phase)) * Math.cos(p * t);
          },
          g: function (t, p, q, R, r, phase) {
            return (R + r * Math.cos(q * t + phase)) * Math.sin(p * t);
          },
          h: function (t, p, q, R, r, phase) {
            return r * Math.sin(q * t + phase);
          },
          transform: function (info, insert) {
            var p = Math.max(1, info.p || 2);
            var q = Math.max(1, info.q || 3);
            var ticks = info.ticks || 0;
            var yaw = headingAngle(info.heading) + ticks * 0.08;
            var extra = parseInsert(insert);
            var R = 2, r = 0.7 + 0.05 * Math.min(ticks, 20);
            return {
              p: p, q: q, R: R, r: r,
              phase: extra.phase + ticks * 0.12,
              scale: extra.scale,
              yaw: yaw,
              pitch: 0.45,
              note: extra.note,
              ticks: ticks,
              heading: info.heading
            };
          },
          project: function (x, y, z, yaw, pitch, w, h, scale) {
            var cy = Math.cos(yaw), sy = Math.sin(yaw);
            var cp = Math.cos(pitch), sp = Math.sin(pitch);
            var x1 = x * cy - z * sy;
            var z1 = x * sy + z * cy;
            var y1 = y * cp - z1 * sp;
            var z2 = y * sp + z1 * cp;
            var persp = 3.2 / (3.2 + z2);
            return {
              X: w * 0.5 + x1 * 46 * scale * persp,
              Y: h * 0.52 - y1 * 46 * scale * persp,
              depth: z2
            };
          },
          draw: function (now) {
            var canvas = document.getElementById('curveCanvas');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var w = canvas.width, h = canvas.height;
            var params = this.transform(object2.info, document.getElementById('user-code').value);
            var tOff = (now || 0) * 0.00035;
            ctx.fillStyle = '#0a0c12';
            ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = 'rgba(80,90,110,0.45)';
            ctx.beginPath();
            ctx.moveTo(20, h * 0.52); ctx.lineTo(w - 20, h * 0.52);
            ctx.moveTo(w * 0.5, 16); ctx.lineTo(w * 0.5, h - 16);
            ctx.stroke();

            var steps = 720;
            var pts = [];
            for (var i = 0; i <= steps; i++) {
              var t = (i / steps) * Math.PI * 2 + tOff;
              var x = this.f(t, params.p, params.q, params.R, params.r, params.phase);
              var y = this.g(t, params.p, params.q, params.R, params.r, params.phase);
              var z = this.h(t, params.p, params.q, params.R, params.r, params.phase);
              pts.push(this.project(x, y, z, params.yaw, params.pitch, w, h, params.scale));
            }
            ctx.lineWidth = 2;
            for (var j = 1; j < pts.length; j++) {
              var a = pts[j - 1], b = pts[j];
              var k = j / pts.length;
              ctx.strokeStyle = 'hsla(' + (200 + k * 80) + ',70%,65%,' + (0.25 + 0.55 * (1 - (b.depth + 3) / 8)) + ')';
              ctx.beginPath();
              ctx.moveTo(a.X, a.Y);
              ctx.lineTo(b.X, b.Y);
              ctx.stroke();
            }
            var tip = pts[pts.length - 1];
            ctx.fillStyle = '#f4b44a';
            ctx.beginPath();
            ctx.arc(tip.X, tip.Y, 3.2, 0, Math.PI * 2);
            ctx.fill();

            document.getElementById('eq-line').textContent =
              'x = f(t) = (R + r cos(q t + φ)) cos(p t)   ' +
              'y = g(t) = (R + r cos(q t + φ)) sin(p t)   ' +
              'z = h(t) = r sin(q t + φ)   | p/q=' + params.p + '/' + params.q +
              '  heading=' + params.heading + '  ticks=' + params.ticks;
          },
          describe: function () {
            var params = this.transform(object2.info, document.getElementById('user-code').value);
            return this.name + ' transformed → literal curve object\n' +
              'p/q = ' + params.p + '/' + params.q +
              '  φ = ' + params.phase.toFixed(3) +
              '  yaw = ' + params.yaw.toFixed(3) +
              '  scale = ' + params.scale +
              (params.note ? '\nnote: ' + params.note : '');
          }
        };
      }
      return {
        getInstance: function () {
          if (!instance) instance = create();
          return instance;
        }
      };
    })();

    document.getElementById('correct-feedback').addEventListener('click', function () {
      var singleton = SpaceCurve.getInstance();
      var out = document.getElementById('check-result');
      out.textContent = singleton.describe();
    });

    render();
    syncRatioFromInputs();
    renderLiveInfo();
    patchScreenDots();
    setInterval(function(){ patchScreenDots(); }, 700);
    requestAnimationFrame(function(now){ sizeDimpleCanvas(); lastStep = now; dimple.lastDrop = now; fillCard(0); tick(now); });
  </script>
</body>
</html>
