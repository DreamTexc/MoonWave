<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Node</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#universal{min-height:100vh}
#starHeader{height:72px;background:#000;overflow:hidden;position:relative;z-index:3}
#starHeader i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%}
#on,#off{position:relative;z-index:40;margin:12px 6px;padding:5px 10px;border:1px solid #666;background:#151515;color:#fff;cursor:pointer;font-size:11px}
#oracleLayer{display:none;position:fixed;inset:0;z-index:10;background:#000;perspective:420px}
#oracleWorld{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 72%}
#oracleWorld b,#focusCore{position:absolute;left:50%;top:62%;pointer-events:none}
#oracleWorld b{background:#fff;border-radius:50%}
#oracleWorld b.hot{background:#9cf;box-shadow:0 0 8px #9cf}
#focusCore{width:220px;height:220px;object-fit:contain;transform-origin:center center;filter:drop-shadow(0 0 18px #245)}
body.character-mode #oracleLayer{display:block}
#touchPad{display:none;position:fixed;inset:0;z-index:30}
body.character-mode #touchPad{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}
#hud{display:none;position:fixed;left:8px;bottom:8px;z-index:41;font-size:11px;color:#9ab;max-width:78%}
body.character-mode #hud{display:block}
</style>
</head>
<body>
<div id="universal">
  <header id="starHeader"></header>
  <!-- ON state control -->
  <button id="on" type="button">ON</button>
  <!-- OFF state control -->
  <button id="off" type="button">OFF</button>
  <div id="oracleLayer">
    <div id="oracleWorld">
      <img id="focusCore" src="dark.png" alt="space center">
    </div>
  </div>
  <div id="touchPad">
    <span data-go=""></span><span data-go="up"></span><span data-go=""></span>
    <span data-go="left"></span><span data-pick="1"></span><span data-go="right"></span>
    <span data-go=""></span><span data-go="down"></span><span data-go=""></span>
  </div>
  <div id="hud">ARRAY idle</div>
</div>
<script>
"use strict";
const parent = document.getElementById("universal");
const header = document.getElementById("starHeader");
const onBtn = document.getElementById("on");
const offBtn = document.getElementById("off");
const world = document.getElementById("oracleWorld");
const hud = document.getElementById("hud");
const focusCore = document.getElementById("focusCore");

for (let n = 0; n < 80; n++) {
  const dot = document.createElement("i");
  dot.style.left = Math.random() * 100 + "%";
  dot.style.top = Math.random() * 100 + "%";
  dot.style.opacity = 0.25 + Math.random() * 0.75;
  header.appendChild(dot);
}

const $ = {
  x: 0, y: 12, z: 0, heading: 0, speed: 7,
  keys: { up: 0, down: 0, left: 0, right: 0 },
  space: {
    center: { x: 0, y: 0, z: 640, locked: true }
  },
  step: function () {
    this.heading += (this.keys.right - this.keys.left) * 0.035;
    const go = this.keys.up - this.keys.down;
    const nx = this.x + Math.sin(this.heading) * go * this.speed;
    const nz = this.z + Math.cos(this.heading) * go * this.speed;
    const c = this.space.center;
    const dist = Math.hypot(nx - c.x, nz - c.z);
    if (dist > 48) { this.x = nx; this.z = nz; }
  }
};

const vault = {
  stars: [],
  fill: function () {
    this.stars = [];
    const c = $.space.center;
    for (let i = 0; i < 420; i++) {
      this.stars.push({
        id: i,
        x: c.x + (Math.random() - 0.5) * 1400,
        y: c.y + (Math.random() - 0.55) * 520,
        z: c.z + (Math.random() - 0.25) * 1200,
        s: 0.6 + Math.random() * 2.2,
        mark: false
      });
    }
  }
};

function projectPoint(x, y, z) {
  const fov = 240;
  const cos = Math.cos($.heading);
  const sin = Math.sin($.heading);
  const dx = x - $.x;
  const dy = y - $.y;
  const dz = z - $.z;
  const rx = dx * cos - dz * sin;
  const rz = dx * sin + dz * cos;
  if (rz < 16) return null;
  const scale = fov / rz;
  return { sx: rx * scale, sy: dy * scale, scale: scale, rz: rz };
}

const rack = {
  view: [],
  picked: [],
  live: null,
  project: function () {
    this.view = [];
    for (let i = 0; i < vault.stars.length; i++) {
      const s = vault.stars[i];
      const p = projectPoint(s.x, s.y, s.z);
      if (!p) continue;
      this.view.push({ id: s.id, sx: p.sx, sy: p.sy, scale: p.scale, s: s });
    }
  },
  pickNearest: function () {
    if (!this.view.length) return;
    this.view.sort(function (a, b) { return b.scale - a.scale; });
    const hit = this.view[0];
    hit.s.mark = !hit.s.mark;
    this.live = hit.s;
    if (hit.s.mark) this.picked.push(hit.s.id);
    else this.picked = this.picked.filter(function (id) { return id !== hit.s.id; });
  },
  clear: function () {
    this.view = [];
    this.picked = [];
    this.live = null;
    vault.stars.forEach(function (s) { s.mark = false; });
  }
};

const oracle = {
  mode: "idle",
  layout: "4XD",
  tick: 0,
  enter: function () {
    this.mode = "character";
    document.body.classList.add("character-mode");
    header.style.display = "block";
    $.x = 0; $.y = 12; $.z = 0; $.heading = 0;
    vault.fill();
    rack.clear();
    cancelAnimationFrame(this.tick);
    const loop = () => { this.draw(); this.tick = requestAnimationFrame(loop); };
    this.tick = requestAnimationFrame(loop);
  },
  exit: function () {
    this.mode = "idle";
    document.body.classList.remove("character-mode");
    header.style.display = "none";
    cancelAnimationFrame(this.tick);
    world.querySelectorAll("b").forEach(function (n) { n.remove(); });
    rack.clear();
  },
  draw: function () {
    $.step();
    rack.project();
    world.querySelectorAll("b").forEach(function (n) { n.remove(); });
    world.style.transform = "rotateX(64deg) translateZ(40px)";
    const c = $.space.center;
    const focus = projectPoint(c.x, c.y, c.z);
    if (focus) {
      const size = Math.max(36, 180 * focus.scale);
      focusCore.style.display = "block";
      focusCore.style.width = size + "px";
      focusCore.style.height = size + "px";
      focusCore.style.transform = "translate(-50%,-50%) translate(" + focus.sx + "px," + focus.sy + "px)";
      focusCore.style.opacity = String(Math.min(1, 0.35 + focus.scale));
      if (rack.live) focusCore.dataset.parentOf = String(rack.live.id);
    } else {
      focusCore.style.display = "none";
    }
    for (let i = 0; i < rack.view.length; i++) {
      const v = rack.view[i];
      const star = document.createElement("b");
      const size = Math.max(1, v.s.s * v.scale * 1.8);
      star.style.width = size + "px";
      star.style.height = size + "px";
      star.style.opacity = String(Math.min(1, 0.15 + v.scale * 0.9));
      star.style.transform = "translate(" + v.sx + "px," + v.sy + "px)";
      if (v.s.mark) star.className = "hot";
      world.appendChild(star);
    }
    const range = Math.hypot($.x - c.x, $.z - c.z).toFixed(0);
    hud.textContent =
      "CENTER locked · range " + range +
      " · ARRAY [" + rack.picked.join(",") + "]" +
      " · live:" + (rack.live ? rack.live.id : "-");
  }
};

function standEval(code) { eval(code); }
onBtn.onclick = function () { standEval("oracle.enter()"); };
offBtn.onclick = function () { standEval("oracle.exit()"); };
standEval("oracle.exit()");

document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowUp") $.keys.up = 1;
  if (e.key === "ArrowDown") $.keys.down = 1;
  if (e.key === "ArrowLeft") $.keys.left = 1;
  if (e.key === "ArrowRight") $.keys.right = 1;
  if (e.key === "Enter" && oracle.mode === "character") rack.pickNearest();
});
document.addEventListener("keyup", function (e) {
  if (e.key === "ArrowUp") $.keys.up = 0;
  if (e.key === "ArrowDown") $.keys.down = 0;
  if (e.key === "ArrowLeft") $.keys.left = 0;
  if (e.key === "ArrowRight") $.keys.right = 0;
});
const pad = document.getElementById("touchPad");
pad.addEventListener("pointerdown", function (e) {
  const go = e.target.getAttribute("data-go");
  const pick = e.target.getAttribute("data-pick");
  if (go) $.keys[go] = 1;
  if (pick) rack.pickNearest();
});
pad.addEventListener("pointerup", function () {
  $.keys.up = $.keys.down = $.keys.left = $.keys.right = 0;
});
pad.addEventListener("pointerleave", function () {
  $.keys.up = $.keys.down = $.keys.left = $.keys.right = 0;
});
</script>
</body>
</html>
