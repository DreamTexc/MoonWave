<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Node</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#fff;font-family:Arial,sans-serif}
#universal{min-height:100vh}
#starHeader{height:72px;background:#000;overflow:hidden;position:relative}
#starHeader i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%}
#on,#off{margin:12px 6px;padding:5px 10px;border:1px solid #666;background:#151515;color:#fff;cursor:pointer;font-size:11px}
</style>
</head>
<body>
<div id="universal">
  <header id="starHeader"></header>
  <!-- ON state control -->
  <button id="on" type="button">ON</button>
  <!-- OFF state control -->
  <button id="off" type="button">OFF</button>
</div>
<script>
"use strict";
const parent = document.getElementById("universal");
const header = document.getElementById("starHeader");
const onBtn = document.getElementById("on");
const offBtn = document.getElementById("off");
for (let n = 0; n < 80; n++) {
  const dot = document.createElement("i");
  dot.style.left = Math.random() * 100 + "%";
  dot.style.top = Math.random() * 100 + "%";
  dot.style.opacity = 0.3 + Math.random() * 0.7;
  header.appendChild(dot);
}
function standEval(code) {
  eval(code);
}
onBtn.onclick = function () { standEval("header.style.display='block'"); };
offBtn.onclick = function () { standEval("header.style.display='none'"); };
standEval("header.style.display='none'");
</script>
</body>
</html>
