<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoonWave Keyboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #121212;
      color: #eee;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    #deskWrap {
      display: none;
      width: min(720px, 92vw);
      max-height: 220px;
    }

    #deskWrap.show {
      display: block;
    }

    #deskWrap img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #444;
    }

    #thought {
      width: min(720px, 92vw);
      min-height: 36px;
      padding: 8px 12px;
      background: #1c1c1c;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 15px;
    }

    #board {
      background: #2a2a2a;
      border-radius: 14px;
      padding: 12px;
      box-shadow:
        inset 0 2px 0 #444,
        0 12px 28px #0008;

      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .row {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .key {
      min-width: 38px;
      height: 38px;
      padding: 0 6px;

      border: 1px solid #555;
      border-radius: 6px;

      background: #3a3a3a;
      color: #eee;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 12px;
      user-select: none;

      box-shadow: 0 3px 0 #111;

      cursor: pointer;

      transition:
        background .08s,
        transform .08s,
        box-shadow .08s;
    }

    .key.wide {
      min-width: 64px;
    }

    .key.space {
      min-width: 240px;
    }

    .key.active,
    .key:active {
      background: #6cf;
      color: #111;
      transform: translateY(2px);
      box-shadow: 0 1px 0 #111;
    }

    /* ==================================================
       RADAR
    ================================================== */

    #radarNav {
      position: relative;
      width: 190px;
      height: 150px;
      margin: 4px auto 2px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #radar {
      position: absolute;

      width: 142px;
      height: 142px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      border: 1px solid #27e6ff88;

      background:
        radial-gradient(
          circle,
          #06252a 0%,
          #031518 45%,
          #020909 75%,
          #000 100%
        );

      box-shadow:
        0 0 12px #00eaff55,
        inset 0 0 22px #00eaff33;

      overflow: hidden;
    }

    #radar::before {
      content: "";

      position: absolute;
      inset: 12px;

      border-radius: 50%;

      border: 1px solid #24eaff44;

      box-shadow:
        0 0 0 20px #00eaff08,
        0 0 0 40px #00eaff06;
    }

    #radar::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 0;

      width: 1px;
      height: 100%;

      background: #24eaff33;
    }

    #radarCross {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 142px;
      height: 1px;

      transform: translate(-50%, -50%);

      background: #24eaff33;

      pointer-events: none;
    }

    #radarSweep {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 68px;
      height: 2px;

      transform-origin: left center;

      background:
        linear-gradient(
          90deg,
          #00ffffaa,
          #00ffff00
        );

      box-shadow: 0 0 8px #00ffff;

      animation:
        radarSweep 2.4s linear infinite;

      pointer-events: none;
    }

    @keyframes radarSweep {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    #radarCenter {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 8px;
      height: 8px;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background: #6ff;

      box-shadow:
        0 0 5px #6ff,
        0 0 14px #00ffff;

      z-index: 3;
    }

    #arrowCluster {
      position: relative;

      width: 128px;
      height: 112px;

      z-index: 5;

      display: grid;

      grid-template-columns: 38px 38px 38px;
      grid-template-rows: 38px 38px 38px;

      gap: 5px;

      justify-content: center;
      align-content: center;
    }

    .arrow-key {
      min-width: 38px;
      width: 38px;
      height: 38px;

      border: 1px solid #35717a;
      border-radius: 7px;

      background: #18343a;
      color: #8ff;

      font-size: 17px;
      font-weight: bold;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      box-shadow:
        0 3px 0 #061011,
        0 0 5px #00eaff22;

      user-select: none;
    }

    .arrow-key.active,
    .arrow-key:active {
      background: #64f6ff;
      color: #031014;

      transform: translateY(2px);

      box-shadow:
        0 1px 0 #061011,
        0 0 18px #00eaff;
    }

    #arrowUp {
      grid-column: 2;
      grid-row: 1;
    }

    #arrowLeft {
      grid-column: 1;
      grid-row: 2;
    }

    #arrowDown {
      grid-column: 2;
      grid-row: 2;
    }

    #arrowRight {
      grid-column: 3;
      grid-row: 2;
    }

    .direction-pulse {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 12px;
      height: 12px;

      margin-left: -6px;
      margin-top: -6px;

      border-radius: 50%;

      border: 2px solid #6ff;

      box-shadow:
        0 0 8px #00ffff,
        0 0 18px #00ffff;

      pointer-events: none;

      z-index: 10;
    }

    /* ==================================================
       TASK BOARD
    ================================================== */

    #taskOverlay {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, .82);

      align-items: center;
      justify-content: center;

      z-index: 100;
    }

    #taskOverlay.show {
      display: flex;
    }

    #taskBoard {
      width: min(920px, 95vw);
      max-height: 92vh;

      overflow: auto;

      padding: 18px;

      background:
        linear-gradient(
          145deg,
          #071316,
          #101b1d
        );

      border: 1px solid #47eaff;

      border-radius: 14px;

      box-shadow:
        0 0 30px #00eaff44,
        inset 0 0 25px #00eaff0c;
    }

    #taskHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 14px;
    }

    #taskHeader h2 {
      color: #8ff;
      font-size: 18px;
    }

    #taskHeader p {
      color: #7f9;
      font-size: 11px;
      margin-top: 3px;
    }

    #closeTasks {
      border: 1px solid #466;
      background: #142326;
      color: #9ff;

      width: 32px;
      height: 32px;

      border-radius: 6px;

      cursor: pointer;

      font-size: 18px;
    }

    /* 4 x 4 */

    #taskGrid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(150px, 1fr));

      gap: 8px;
    }

    .taskCell {
      min-height: 165px;

      position: relative;

      padding: 9px;

      border: 1px solid #31555b;

      border-radius: 8px;

      background:
        linear-gradient(
          145deg,
          #111b1d,
          #0b1315
        );

      transition:
        border-color .15s,
        box-shadow .15s,
        background .15s;
    }

    .taskCell.complete {
      border-color: #55ff99;

      background:
        linear-gradient(
          145deg,
          #10241a,
          #091510
        );

      box-shadow:
        0 0 12px #32ff8844;
    }

    .taskCellHeader {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 7px;
    }

    .taskCode {
      color: #6ff;

      font-size: 10px;

      font-family: monospace;
    }

    .taskNumber {
      color: #777;

      font-size: 10px;
    }

    .taskCell input {
      width: 100%;

      height: 34px;

      padding: 6px 7px;

      border-radius: 5px;

      border: 1px solid #34484c;

      background: #071012;

      color: #eee;

      outline: none;

      font-size: 12px;
    }

    .taskCell input:focus {
      border-color: #55eaff;

      box-shadow:
        0 0 7px #00eaff33;
    }

    .todoLabel {
      display: block;

      margin-top: 7px;
      margin-bottom: 3px;

      color: #8aa;

      font-size: 9px;

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    .taskCell textarea {
      width: 100%;

      height: 52px;

      resize: none;

      padding: 6px 7px;

      border-radius: 5px;

      border: 1px solid #34484c;

      background: #071012;

      color: #eee;

      outline: none;

      font-family: inherit;

      font-size: 11px;
    }

    .taskCell textarea:focus {
      border-color: #55eaff;

      box-shadow:
        0 0 7px #00eaff33;
    }

    .taskControls {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-top: 6px;
    }

    .taskY {
      width: 34px;
      height: 27px;

      border-radius: 5px;

      border: 1px solid #487;

      background: #12221d;

      color: #7f9;

      font-weight: bold;

      cursor: pointer;
    }

    .taskY:hover {
      background: #1d4030;
    }

    .taskCheck {
      color: #55ff99;

      font-size: 20px;

      font-weight: bold;

      opacity: 0;

      transform: scale(.5);

      transition:
        opacity .15s,
        transform .15s;
    }

    .taskCell.complete .taskCheck {
      opacity: 1;
      transform: scale(1);
    }

    #taskFooter {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 10px;

      margin-top: 14px;
    }

    #taskStatus {
      color: #8aa;

      font-family: monospace;

      font-size: 11px;
    }

    #completeTaskList {
      padding: 9px 13px;

      border: 1px solid #56eaff;

      border-radius: 6px;

      background: #10343a;

      color: #9ff;

      cursor: pointer;
    }

    #completeTaskList:hover {
      background: #17505a;
    }

    #taskOutput {
      display: none;

      margin-top: 12px;

      padding: 10px;

      border: 1px solid #31555b;

      border-radius: 7px;

      background: #050b0d;

      color: #9ff;

      font-family: monospace;

      font-size: 11px;

      line-height: 1.5;

      white-space: pre-wrap;
    }

    #taskOutput.show {
      display: block;
    }

    /* ==================================================
       SCAN
    ================================================== */

    #scan {
      display: none;

      position: fixed;
      inset: 0;

      background: #000a;

      align-items: center;
      justify-content: center;

      z-index: 20;
    }

    #scan.show {
      display: flex;
    }

    .brain {
      width: min(420px, 90vw);
      height: 320px;

      border-radius: 50% 50% 46% 46%;

      background:
        radial-gradient(
          circle at 50% 40%,
          #2a4a4a 0%,
          #0b1a1a 70%
        );

      border: 3px solid #4fd;

      box-shadow:
        0 0 40px #0ff4,
        inset 0 0 40px #0ff3;

      position: relative;

      overflow: hidden;
    }

    .brain::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;

      height: 18px;

      background:
        linear-gradient(
          #0ff6,
          transparent
        );

      animation:
        sweep 1.6s linear infinite;
    }

    @keyframes sweep {
      from {
        top: -20px;
      }

      to {
        top: 100%;
      }
    }

    .popup {
      position: absolute;

      left: 10%;
      right: 10%;

      top: 22%;
      bottom: 16%;

      background: #041010ee;

      border: 1px solid #6ff;

      border-radius: 10px;

      padding: 10px 12px;

      overflow: auto;

      font-size: 13px;

      line-height: 1.4;

      z-index: 2;
    }

    .popup h3 {
      color: #8ff;

      margin-bottom: 6px;

      font-size: 14px;
    }

    .popup a {
      color: #9df;
    }

    .close {
      position: absolute;

      top: 8px;
      right: 12px;

      background: none;

      border: 0;

      color: #8ff;

      font-size: 18px;

      cursor: pointer;

      z-index: 3;
    }

    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      #taskGrid {
        grid-template-columns:
          repeat(2, minmax(135px, 1fr));
      }

      #taskBoard {
        padding: 12px;
      }
    }

    @media (max-width: 430px) {

      #taskGrid {
        grid-template-columns: 1fr;
      }

      .taskCell {
        min-height: 150px;
      }

      .key.space {
        min-width: 180px;
      }
    }

  </style>
</head>

<body>

  <!-- ==================================================
       DESK
  ================================================== -->

  <div id="deskWrap">

    <img
      id="desk"
      alt="desk"
      src="desk.png">

  </div>


  <!-- ==================================================
       THOUGHT
  ================================================== -->

  <div id="thought"></div>


  <!-- ==================================================
       KEYBOARD
  ================================================== -->

  <div id="board"></div>


  <!-- ==================================================
       RADAR
  ================================================== -->

  <div id="radarNav">

    <div id="radar">

      <div id="radarSweep"></div>

      <div id="radarCenter"></div>

    </div>

    <div id="radarCross"></div>

    <div id="arrowCluster">

      <button
        type="button"
        class="arrow-key"
        id="arrowUp"
        data-direction="up">
        ↑
      </button>

      <button
        type="button"
        class="arrow-key"
        id="arrowLeft"
        data-direction="left">
        ←
      </button>

      <button
        type="button"
        class="arrow-key"
        id="arrowDown"
        data-direction="down">
        ↓
      </button>

      <button
        type="button"
        class="arrow-key"
        id="arrowRight"
        data-direction="right">
        →
      </button>

    </div>

  </div>


  <!-- ==================================================
       4 x 4 TASK BOARD
  ================================================== -->

  <div id="taskOverlay">

    <div id="taskBoard">

      <div id="taskHeader">

        <div>

          <h2>
            TB / TR — 4×4 TASK MATRIX
          </h2>

          <p>
            nested symbol task system
          </p>

        </div>

        <button
          type="button"
          id="closeTasks">
          ×
        </button>

      </div>


      <div id="taskGrid"></div>


      <div id="taskFooter">

        <div id="taskStatus">
          0 / 16 tasks complete
        </div>

        <button
          type="button"
          id="completeTaskList">
          COMPLETE TASK LIST
        </button>

      </div>


      <div id="taskOutput"></div>

    </div>

  </div>


  <!-- ==================================================
       SCAN
  ================================================== -->

  <div id="scan">

    <div class="brain">

      <button
        class="close"
        type="button"
        id="closeScan">
        ×
      </button>

      <div
        class="popup"
        id="scanBox">
        scanning…
      </div>

    </div>

  </div>


  <script>

    /* ==================================================
       KEYBOARD
    ================================================== */

    const ROWS = [

      [
        '`','1','2','3','4','5','6','7',
        '8','9','0','-','='
      ],

      [
        'Tab','Q','W','E','R','T','Y',
        'U','I','O','P','[',']','\\'
      ],

      [
        'Caps','A','S','D','F','G','H',
        'J','K','L',';','\'','Enter'
      ],

      [
        'Shift','Z','X','C','V','B','N',
        'M',',','.','/','Shift'
      ],

      [
        'Ctrl','Alt','Space','Alt','Ctrl'
      ]

    ];


    const STOP = new Set(

      'a an the and or of to for in on at is are was were be been being what who how why when where which that this those these i you we they it my your our with from about into over after before not no yes please can could would should do does did'
        .split(' ')

    );


    const board =
      document.getElementById('board');

    const thoughtEl =
      document.getElementById('thought');

    const deskWrap =
      document.getElementById('deskWrap');

    const deskImg =
      document.getElementById('desk');

    const scan =
      document.getElementById('scan');

    const scanBox =
      document.getElementById('scanBox');

    const byLabel =
      new Map();


    let buffer = '';


    deskImg.onerror = () => {

      deskImg.src =
        'https://raw.githubusercontent.com/DreamTexc/MoonWave/main/desk.png';

    };


    /* ==================================================
       BUILD KEYBOARD
    ================================================== */

    for (const row of ROWS) {

      const rowEl =
        document.createElement('div');

      rowEl.className = 'row';


      for (const label of row) {

        const key =
          document.createElement('button');

        key.type = 'button';

        key.className = 'key';

        key.dataset.label = label;

        key.textContent =
          label === 'Space'
            ? ''
            : label;


        if (label === 'Space') {

          key.classList.add('space');

        }


        if (
          [
            'Tab',
            'Caps',
            'Enter',
            'Shift',
            'Ctrl',
            'Alt'
          ].includes(label)
        ) {

          key.classList.add('wide');

        }


        key.addEventListener(
          'click',
          () => handleLabel(label)
        );


        rowEl.appendChild(key);


        byLabel.set(
          label.toLowerCase(),
          key
        );

      }


      board.appendChild(rowEl);

    }


    /* ==================================================
       THOUGHT
    ================================================== */

    function paintThought() {

      thoughtEl.textContent =
        buffer ||
        'type a thought, then Enter';

    }


    paintThought();


    /* ==================================================
       KEYBOARD LABEL HANDLER
    ================================================== */

    function handleLabel(label) {

      if (label === 'Enter') {

        submitThought();

        return;

      }


      if (label === 'Space') {

        openTaskBoard();

        return;

      }


      if (
        label === 'Tab' ||
        label === 'Caps' ||
        label === 'Shift' ||
        label === 'Ctrl' ||
        label === 'Alt'
      ) {

        return;

      }


      if (label.length === 1) {

        buffer +=
          label.toLowerCase();

      }


      paintThought();

    }


    /* ==================================================
       NORMALIZE PHYSICAL KEYS
    ================================================== */

    function normalize(e) {

      if (e.key === ' ')
        return 'space';

      if (e.key === 'Control')
        return 'ctrl';

      if (e.key === 'Alt')
        return 'alt';

      if (e.key === 'Shift')
        return 'shift';

      if (e.key === 'CapsLock')
        return 'caps';

      if (e.key === 'Enter')
        return 'enter';

      if (e.key === 'Tab')
        return 'tab';

      if (e.key === 'Backspace')
        return 'backspace';

      return e.key.toLowerCase();

    }


    /* ==================================================
       RADAR
    ================================================== */

    const directionKeys = {

      ArrowUp:
        document.getElementById('arrowUp'),

      ArrowDown:
        document.getElementById('arrowDown'),

      ArrowLeft:
        document.getElementById('arrowLeft'),

      ArrowRight:
        document.getElementById('arrowRight')

    };


    function fireRadarSignal(direction) {

      const radarNav =
        document.getElementById('radarNav');


      const pulse =
        document.createElement('div');

      pulse.className =
        'direction-pulse';


      const vectors = {

        up: [0, -48],

        down: [0, 48],

        left: [-48, 0],

        right: [48, 0]

      };


      const [x, y] =
        vectors[direction];


      radarNav.appendChild(pulse);


      pulse.animate(

        [

          {
            transform:
              'translate(0,0) scale(.4)',

            opacity: 1

          },

          {

            transform:
              `translate(${x}px,${y}px) scale(2.4)`,

            opacity: 0

          }

        ],

        {

          duration: 650,

          easing: 'ease-out'

        }

      );


      setTimeout(
        () => pulse.remove(),
        700
      );

    }


    function handleArrow(direction) {

      const key =
        directionKeys[
          'Arrow' +
          direction.charAt(0).toUpperCase() +
          direction.slice(1)
        ];


      if (!key) return;


      key.classList.add('active');


      fireRadarSignal(direction);


      setTimeout(
        () => key.classList.remove('active'),
        130
      );

    }


    document
      .querySelectorAll('.arrow-key')
      .forEach(key => {

        key.addEventListener(
          'click',
          () => {

            handleArrow(
              key.dataset.direction
            );

          }
        );

      });


    /* ==================================================
       4 x 4 TASK SYSTEM
    ================================================== */

    const taskOverlay =
      document.getElementById('taskOverlay');

    const taskGrid =
      document.getElementById('taskGrid');

    const taskStatus =
      document.getElementById('taskStatus');

    const taskOutput =
      document.getElementById('taskOutput');


    /*
      Every one of the 16 cells has
      its own nested TB/TR object.

      TB = task branch
      TR = task record

      The structure is intentionally nested
      so more symbol rules can be added later.
    */

    const taskMatrix = [];


    for (let row = 0; row < 4; row++) {

      const rowData = [];


      for (let col = 0; col < 4; col++) {

        const index =
          row * 4 + col + 1;


        const cellData = {

          index,

          position: {
            row: row + 1,
            column: col + 1
          },

          TB: {

            TR: {

              information: '',

              todo: '',

              symbol: {
                pending: '○',
                complete: '✓'
              },

              done: false

            }

          }

        };


        rowData.push(cellData);


        const cell =
          document.createElement('div');

        cell.className =
          'taskCell';

        cell.dataset.index =
          index;


        cell.innerHTML = `

          <div class="taskCellHeader">

            <span class="taskCode">
              TB;TR;4x4.${row + 1}.${col + 1}
            </span>

            <span class="taskNumber">
              #${index}
            </span>

          </div>

          <input
            type="text"
            class="taskInfo"
            placeholder="information">

          <span class="todoLabel">
            TO DO
          </span>

          <textarea
            class="taskTodo"
            placeholder="add a task..."></textarea>

          <div class="taskControls">

            <button
              type="button"
              class="taskY">
              Y
            </button>

            <span
              class="taskCheck">
              ✓
            </span>

          </div>

        `;


        const info =
          cell.querySelector('.taskInfo');

        const todo =
          cell.querySelector('.taskTodo');

        const y =
          cell.querySelector('.taskY');


        info.addEventListener(
          'input',
          () => {

            cellData.TB.TR.information =
              info.value;

          }
        );


        todo.addEventListener(
          'input',
          () => {

            cellData.TB.TR.todo =
              todo.value;

          }
        );


        y.addEventListener(
          'click',
          () => {

            completeTask(
              cellData,
              cell
            );

          }
        );


        taskGrid.appendChild(cell);

      }


      taskMatrix.push(rowData);

    }


    /* ==================================================
       OPEN TASK BOARD
    ================================================== */

    function openTaskBoard() {

      taskOverlay.classList.add('show');

      updateTaskStatus();

    }


    /* ==================================================
       CLOSE TASK BOARD
    ================================================== */

    document
      .getElementById('closeTasks')
      .addEventListener(
        'click',
        () => {

          taskOverlay.classList.remove(
            'show'
          );

        }
      );


    /* ==================================================
       COMPLETE ONE TASK
    ================================================== */

    function completeTask(data, cell) {

      data.TB.TR.done = true;


      /*
        This is the nested symbol code.

        pending:
          ○

        complete:
          ✓

        The Y operation changes
        the nested symbol state.
      */

      data.TB.TR.symbol =
        data.TB.TR.symbol.complete;


      cell.classList.add('complete');


      updateTaskStatus();


      /*
        Message requested:
        "task done"
      */

      showTaskMessage(
        data
      );

    }


    /* ==================================================
       TASK DONE MESSAGE
    ================================================== */

    function showTaskMessage(data) {

      const info =
        data.TB.TR.information ||
        '(no information)';

      const todo =
        data.TB.TR.todo ||
        '(no to-do description)';


      taskOutput.classList.add('show');


      taskOutput.textContent =
        'TASK DONE\n' +
        'TB;TR;4x4.' +
        data.position.row +
        '.' +
        data.position.column +
        '\n' +
        '✓ task done\n' +
        'information: ' +
        info +
        '\n' +
        'to do: ' +
        todo;

    }


    /* ==================================================
       STATUS
    ================================================== */

    function updateTaskStatus() {

      let completed = 0;


      for (const row of taskMatrix) {

        for (const data of row) {

          if (data.TB.TR.done) {

            completed++;

          }

        }

      }


      taskStatus.textContent =
        `${completed} / 16 tasks complete`;

    }


    /* ==================================================
       COMPLETE TASK LIST
    ================================================== */

    document
      .getElementById('completeTaskList')
      .addEventListener(
        'click',
        () => {

          const lines = [];

          let completed = 0;


          lines.push(
            'TB;TR;4x4 TASK LIST'
          );

          lines.push(
            '===================='
          );


          for (const row of taskMatrix) {

            for (const data of row) {

              const cell =
                data.position;


              const symbol =
                data.TB.TR.done
                  ? data.TB.TR.symbol
                  : data.TB.TR.symbol.pending;


              if (data.TB.TR.done) {

                completed++;

              }


              lines.push(

                `[${symbol}] ` +

                `TB;TR;` +

                `${cell.row},${cell.column}` +

                ' | ' +

                (
                  data.TB.TR.information ||
                  '(no information)'
                ) +

                ' | TO DO: ' +

                (
                  data.TB.TR.todo ||
                  '(empty)'
                )

              );

            }

          }


          lines.push('');

          lines.push(
            `COMPLETED: ${completed}/16`
          );


          if (completed === 16) {

            lines.push(
              '✓ TASK LIST COMPLETE — TASK DONE'
            );

          }


          taskOutput.classList.add('show');


          taskOutput.textContent =
            lines.join('\n');

        }
      );


    /* ==================================================
       PHYSICAL KEYBOARD
    ================================================== */

    window.addEventListener(
      'keydown',
      (e) => {

        /* ----------------------------------------------
           RADAR
        ---------------------------------------------- */

        if (
          e.key === 'ArrowUp' ||
          e.key === 'ArrowDown' ||
          e.key === 'ArrowLeft' ||
          e.key === 'ArrowRight'
        ) {

          e.preventDefault();


          const direction =
            e.key
              .replace(
                'Arrow',
                ''
              )
              .toLowerCase();


          const arrowKey =
            directionKeys[e.key];


          if (arrowKey) {

            arrowKey.classList.add(
              'active'
            );

          }


          fireRadarSignal(
            direction
          );


          return;

        }


        /* ----------------------------------------------
           NORMAL KEYBOARD
        ---------------------------------------------- */

        const n =
          normalize(e);


        const el =
          byLabel.get(n);


        if (el) {

          el.classList.add(
            'active'
          );

        }


        /* ----------------------------------------------
           ENTER
        ---------------------------------------------- */

        if (n === 'enter') {

          e.preventDefault();

          submitThought();

          return;

        }


        /* ----------------------------------------------
           BACKSPACE
        ---------------------------------------------- */

        if (n === 'backspace') {

          buffer =
            buffer.slice(0, -1);

          paintThought();

          return;

        }


        /* ----------------------------------------------
           SPACE
        ---------------------------------------------- */

        if (n === 'space') {

          e.preventDefault();

          openTaskBoard();

          return;

        }


        /* ----------------------------------------------
           LETTERS / NUMBERS
        ---------------------------------------------- */

        if (
          e.key.length === 1 &&
          !e.ctrlKey &&
          !e.metaKey
        ) {

          buffer += e.key;

          paintThought();

        }

      }
    );


    /* ==================================================
       KEY RELEASE
    ================================================== */

    window.addEventListener(
      'keyup',
      (e) => {

        if (
          e.key === 'ArrowUp' ||
          e.key === 'ArrowDown' ||
          e.key === 'ArrowLeft' ||
          e.key === 'ArrowRight'
        ) {

          const arrowKey =
            directionKeys[e.key];


          if (arrowKey) {

            arrowKey.classList.remove(
              'active'
            );

          }


          return;

        }


        const el =
          byLabel.get(
            normalize(e)
          );


        if (el) {

          el.classList.remove(
            'active'
          );

        }

      }
    );


    /* ==================================================
       SCAN CLOSE
    ================================================== */

    document
      .getElementById('closeScan')
      .onclick = () => {

        scan.classList.remove(
          'show'
        );

      };


    /* ==================================================
       BACKEND
    ================================================== */

    class OrganizeThoughts {

      keywords(text) {

        const words =
          String(text)
            .toLowerCase()
            .replace(
              /[^a-z0-9\s]/g,
              ' '
            )
            .split(/\s+/)
            .filter(Boolean);


        const kept =
          words.filter(
            w =>
              w.length > 2 &&
              !STOP.has(w)
          );


        const uniq =
          [
            ...new Set(
              kept.length
                ? kept
                : words
            )
          ];


        return uniq.slice(
          0,
          6
        );

      }


      query(keys) {

        return keys
          .slice(0, 4)
          .join(' ');

      }


      async wikipedia(query) {

        if (!query) {

          return {

            title: 'empty',

            extract:
              'No thought to scan.',

            url: ''

          };

        }


        const searchUrl =
          'https://en.wikipedia.org/w/api.php' +
          '?action=query' +
          '&list=search' +
          '&format=json' +
          '&origin=*' +
          '&srlimit=1' +
          '&srsearch=' +
          encodeURIComponent(query);


        const s =
          await fetch(searchUrl)
            .then(r => r.json());


        const hit =
          s?.query?.search?.[0];


        if (!hit) {

          return {

            title: query,

            extract:
              'No Wikipedia match.',

            url:
              'https://en.wikipedia.org/wiki/Special:Search/' +
              encodeURIComponent(query)

          };

        }


        const title =
          hit.title;


        const sumUrl =
          'https://en.wikipedia.org/api/rest_v1/page/summary/' +
          encodeURIComponent(title);


        const sum =
          await fetch(sumUrl)
            .then(r => r.json());


        return {

          title:
            sum.title ||
            title,

          extract:
            sum.extract ||
            hit.snippet.replace(
              /<[^>]+>/g,
              ''
            ),

          url:
            sum.content_urls?.desktop?.page ||
            (
              'https://en.wikipedia.org/wiki/' +
              encodeURIComponent(title)
            )

        };

      }


      async run(text) {

        const keys =
          this.keywords(text);

        const q =
          this.query(keys);

        const page =
          await this.wikipedia(q);


        return {
          keys,
          q,
          page
        };

      }

    }


    const organizer =
      new OrganizeThoughts();


    /* ==================================================
       SUBMIT THOUGHT
    ================================================== */

    async function submitThought() {

      const text =
        buffer.trim();


      deskWrap.classList.add(
        'show'
      );


      scan.classList.add(
        'show'
      );


      scanBox.innerHTML =
        '<h3>brain scan</h3>' +
        '<p>organizing…</p>';


      if (!text) {

        scanBox.innerHTML =
          '<h3>brain scan</h3>' +
          '<p>type a thought first</p>';

        return;

      }


      try {

        const {
          keys,
          q,
          page
        } =
          await organizer.run(
            text
          );


        scanBox.innerHTML =

          '<h3>' +
          escapeHtml(
            page.title
          ) +
          '</h3>' +

          '<p>' +
          escapeHtml(
            page.extract
          ) +
          '</p>' +

          (
            page.url
              ? '<p>' +
                '<a href="' +
                page.url +
                '" target="_blank" rel="noopener">' +
                'wikipedia' +
                '</a>' +
                '</p>'

              : ''
          );


        void keys;
        void q;

      }

      catch (err) {

        scanBox.innerHTML =
          '<h3>brain scan</h3>' +
          '<p>lookup failed</p>';

      }

    }


    /* ==================================================
       HTML ESCAPE
    ================================================== */

    function escapeHtml(s) {

      return String(s).replace(

        /[&<>"']/g,

        c =>
          ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
          })[c]

      );

    }

  </script>
