<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoonWave Keyboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #1a1a1a;
      color: #eee;
      font-family: system-ui, sans-serif;
    }
    #board {
      background: #2a2a2a;
      border-radius: 14px;
      padding: 14px;
      box-shadow: inset 0 2px 0 #444, 0 12px 28px #0008;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .key {
      min-width: 42px;
      height: 42px;
      padding: 0 8px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #3a3a3a;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      user-select: none;
      box-shadow: 0 3px 0 #111;
    }
    .key.wide { min-width: 72px; }
    .key.space { min-width: 260px; }
    .key.active {
      background: #6cf;
      color: #111;
      transform: translateY(2px);
      box-shadow: 0 1px 0 #111;
    }
    #out { font-size: 14px; opacity: 0.8; }
  </style>
</head>
<body>
  <div id="board"></div>
  <div id="out">Press any key</div>

  <script>
    const ROWS = [
      ['`','1','2','3','4','5','6','7','8','9','0','-','='],
      ['Tab','Q','W','E','R','T','Y','U','I','O','P','[',']','\\'],
      ['Caps','A','S','D','F','G','H','J','K','L',';','\'','Enter'],
      ['Shift','Z','X','C','V','B','N','M',',','.','/','Shift'],
      ['Ctrl','Alt','Space','Alt','Ctrl']
    ];

    // local Set of every key on the board
    const localKeys = new Set(ROWS.flat());

    const board = document.getElementById('board');
    const out = document.getElementById('out');
    const byLabel = new Map();

    for (const row of ROWS) {
      const rowEl = document.createElement('div');
      rowEl.className = 'row';
      for (const label of row) {
        const key = document.createElement('button');
        key.type = 'button';
        key.className = 'key';
        key.dataset.label = label;
        key.textContent = label === 'Space' ? '' : label;
        if (label === 'Space') key.classList.add('space');
        if (['Tab','Caps','Enter','Shift','Ctrl','Alt'].includes(label)) key.classList.add('wide');
        rowEl.appendChild(key);
        byLabel.set(label.toLowerCase(), key);
      }
      board.appendChild(rowEl);
    }

    function normalize(e) {
      if (e.key === ' ') return 'space';
      if (e.key === 'Control') return 'ctrl';
      if (e.key === 'Alt') return 'alt';
      if (e.key === 'Shift') return 'shift';
      if (e.key === 'CapsLock') return 'caps';
      if (e.key === 'Enter') return 'enter';
      if (e.key === 'Tab') return 'tab';
      if (e.key === 'Backslash') return '\\';
      return e.key.toLowerCase();
    }

    window.addEventListener('keydown', (e) => {
      const label = normalize(e);
      const el = byLabel.get(label);
      if (el) el.classList.add('active');
      out.textContent = localKeys.has(el ? el.dataset.label : e.key)
        ? 'on board: ' + (el ? el.dataset.label : e.key)
        : 'not on this board: ' + e.key;
    });

    window.addEventListener('keyup', (e) => {
      const el = byLabel.get(normalize(e));
      if (el) el.classList.remove('active');
    });
  </script>
</body>
</html>
