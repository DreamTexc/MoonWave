<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoonWave Keyboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #121212;
      color: #eee;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #deskWrap {
      display: none;
      width: min(720px, 92vw);
      max-height: 220px;
    }
    #deskWrap.show { display: block; }
    #deskWrap img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #444;
    }
    #thought {
      width: min(720px, 92vw);
      min-height: 36px;
      padding: 8px 12px;
      background: #1c1c1c;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 15px;
    }
    #board {
      background: #2a2a2a;
      border-radius: 14px;
      padding: 12px;
      box-shadow: inset 0 2px 0 #444, 0 12px 28px #0008;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .row { display: flex; gap: 5px; justify-content: center; }
    .key {
      min-width: 38px;
      height: 38px;
      padding: 0 6px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #3a3a3a;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      user-select: none;
      box-shadow: 0 3px 0 #111;
    }
    .key.wide { min-width: 64px; }
    .key.space { min-width: 240px; }
    .key.active, .key:active {
      background: #6cf;
      color: #111;
      transform: translateY(2px);
      box-shadow: 0 1px 0 #111;
    }
    #scan {
      display: none;
      position: fixed;
      inset: 0;
      background: #000a;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    #scan.show { display: flex; }
    .brain {
      width: min(420px, 90vw);
      height: 320px;
      border-radius: 50% 50% 46% 46%;
      background:
        radial-gradient(circle at 50% 40%, #2a4a4a 0%, #0b1a1a 70%);
      border: 3px solid #4fd;
      box-shadow: 0 0 40px #0ff4, inset 0 0 40px #0ff3;
      position: relative;
      overflow: hidden;
    }
    .brain::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      height: 18px;
      background: linear-gradient(#0ff6, transparent);
      animation: sweep 1.6s linear infinite;
    }
    @keyframes sweep {
      from { top: -20px; }
      to { top: 100%; }
    }
    .popup {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 22%;
      bottom: 16%;
      background: #041010ee;
      border: 1px solid #6ff;
      border-radius: 10px;
      padding: 10px 12px;
      overflow: auto;
      font-size: 13px;
      line-height: 1.4;
      z-index: 2;
    }
    .popup h3 { color: #8ff; margin-bottom: 6px; font-size: 14px; }
    .popup a { color: #9df; }
    .close {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: 0;
      color: #8ff;
      font-size: 18px;
      cursor: pointer;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div id="deskWrap">
    <img id="desk" alt="desk" src="desk.png">
  </div>
  <div id="thought"></div>
  <div id="board"></div>

  <div id="scan">
    <div class="brain">
      <button class="close" type="button" id="closeScan">×</button>
      <div class="popup" id="scanBox">scanning…</div>
    </div>
  </div>

  <script>
    const ROWS = [
      ['`','1','2','3','4','5','6','7','8','9','0','-','='],
      ['Tab','Q','W','E','R','T','Y','U','I','O','P','[',']','\\'],
      ['Caps','A','S','D','F','G','H','J','K','L',';','\'','Enter'],
      ['Shift','Z','X','C','V','B','N','M',',','.','/','Shift'],
      ['Ctrl','Alt','Space','Alt','Ctrl']
    ];
    const localKeys = new Set(ROWS.flat());
    const STOP = new Set('a an the and or of to for in on at is are was were be been being what who how why when where which that this those these i you we they it my your our with from about into over after before not no yes please can could would should do does did'.split(' '));

    const board = document.getElementById('board');
    const thoughtEl = document.getElementById('thought');
    const deskWrap = document.getElementById('deskWrap');
    const deskImg = document.getElementById('desk');
    const scan = document.getElementById('scan');
    const scanBox = document.getElementById('scanBox');
    const byLabel = new Map();
    let buffer = '';

    deskImg.onerror = () => {
      deskImg.src = 'https://raw.githubusercontent.com/DreamTexc/MoonWave/main/desk.png';
    };

    for (const row of ROWS) {
      const rowEl = document.createElement('div');
      rowEl.className = 'row';
      for (const label of row) {
        const key = document.createElement('button');
        key.type = 'button';
        key.className = 'key';
        key.dataset.label = label;
        key.textContent = label === 'Space' ? '' : label;
        if (label === 'Space') key.classList.add('space');
        if (['Tab','Caps','Enter','Shift','Ctrl','Alt'].includes(label)) key.classList.add('wide');
        key.addEventListener('click', () => handleLabel(label));
        rowEl.appendChild(key);
        byLabel.set(label.toLowerCase(), key);
      }
      board.appendChild(rowEl);
    }

    function paintThought() {
      thoughtEl.textContent = buffer || 'type a thought, then Enter';
    }
    paintThought();

    function handleLabel(label) {
      if (label === 'Enter') {
        submitThought();
        return;
      }
      if (label === 'Space') { buffer += ' '; paintThought(); return; }
      if (label === 'Tab' || label === 'Caps' || label === 'Shift' || label === 'Ctrl' || label === 'Alt') return;
      if (label.length === 1) buffer += label.toLowerCase();
      paintThought();
    }

    function normalize(e) {
      if (e.key === ' ') return 'space';
      if (e.key === 'Control') return 'ctrl';
      if (e.key === 'Alt') return 'alt';
      if (e.key === 'Shift') return 'shift';
      if (e.key === 'CapsLock') return 'caps';
      if (e.key === 'Enter') return 'enter';
      if (e.key === 'Tab') return 'tab';
      if (e.key === 'Backspace') return 'backspace';
      return e.key.toLowerCase();
    }

    window.addEventListener('keydown', (e) => {
      const n = normalize(e);
      const el = byLabel.get(n);
      if (el) el.classList.add('active');
      if (n === 'enter') {
        e.preventDefault();
        submitThought();
        return;
      }
      if (n === 'backspace') {
        buffer = buffer.slice(0, -1);
        paintThought();
        return;
      }
      if (n === 'space') {
        e.preventDefault();
        buffer += ' ';
        paintThought();
        return;
      }
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
        buffer += e.key;
        paintThought();
      }
    });

    window.addEventListener('keyup', (e) => {
      const el = byLabel.get(normalize(e));
      if (el) el.classList.remove('active');
    });

    document.getElementById('closeScan').onclick = () => scan.classList.remove('show');

    // backend — not shown in the UI
    class OrganizeThoughts {
      keywords(text) {
        const words = String(text).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
        const kept = words.filter(w => w.length > 2 && !STOP.has(w));
        const uniq = [...new Set(kept.length ? kept : words)];
        return uniq.slice(0, 6);
      }
      query(keys) {
        return keys.slice(0, 4).join(' ');
      }
      async wikipedia(query) {
        if (!query) return { title: 'empty', extract: 'No thought to scan.', url: '' };
        const searchUrl = 'https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=1&srsearch=' + encodeURIComponent(query);
        const s = await fetch(searchUrl).then(r => r.json());
        const hit = s?.query?.search?.[0];
        if (!hit) return { title: query, extract: 'No Wikipedia match.', url: 'https://en.wikipedia.org/wiki/Special:Search/' + encodeURIComponent(query) };
        const title = hit.title;
        const sumUrl = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title);
        const sum = await fetch(sumUrl).then(r => r.json());
        return {
          title: sum.title || title,
          extract: sum.extract || hit.snippet.replace(/<[^>]+>/g, ''),
          url: sum.content_urls?.desktop?.page || ('https://en.wikipedia.org/wiki/' + encodeURIComponent(title))
        };
      }
      async run(text) {
        const keys = this.keywords(text);
        const q = this.query(keys);
        const page = await this.wikipedia(q);
        return { keys, q, page };
      }
    }

    const organizer = new OrganizeThoughts();

    async function submitThought() {
      const text = buffer.trim();
      deskWrap.classList.add('show');
      scan.classList.add('show');
      scanBox.innerHTML = '<h3>brain scan</h3><p>organizing…</p>';
      if (!text) {
        scanBox.innerHTML = '<h3>brain scan</h3><p>type a thought first</p>';
        return;
      }
      try {
        const { keys, q, page } = await organizer.run(text);
        scanBox.innerHTML =
          '<h3>' + escapeHtml(page.title) + '</h3>' +
          '<p>' + escapeHtml(page.extract) + '</p>' +
          (page.url ? '<p><a href="' + page.url + '" target="_blank" rel="noopener">wikipedia</a></p>' : '');
        void keys; void q;
      } catch (err) {
        scanBox.innerHTML = '<h3>brain scan</h3><p>lookup failed</p>';
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
