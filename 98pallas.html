<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPEC.DEPO01 — Enhanced</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .image-preview img { width: 150px; margin-right: 10px; }
        #rocketCanvas { border: 1px solid black; display: block; margin-top: 20px; }
        #modifiedImage { width: 200px; margin-top: 10px; border: 1px solid #ccc; }
        #ETE { width: 200px; height: 200px; object-fit: cover; border: 1px solid #ccc; }
        #eteTextBoxContainer { display: none; width: 200px; height: 200px; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; }
        #eteTextInput { width: 100%; height: 140px; resize: none; }
        #keylock { font-size: 22px; letter-spacing: 0.35em; text-transform: lowercase; width: 220px; padding: 8px; }
        .erbm-key { display: inline-block; min-width: 1.4em; text-align: center; padding: 2px 6px; margin: 0 2px; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .erbm-key[data-key="e"] { background: #1b4d89; color: #fff; }
        .erbm-key[data-key="r"] { background: #9a3412; color: #fff; }
        .erbm-key[data-key="b"] { background: #111; color: #eee; }
        .erbm-key[data-key="m"] { background: #4b5563; color: #fff; }
        #bottomWorlds { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 180px 180px; gap: 8px; margin-top: 16px; }
        #bottomWorlds .world { position: relative; overflow: hidden; border: 2px solid #222; cursor: pointer; }
        #bottomWorlds .world img { width: 100%; height: 100%; object-fit: cover; display: block; }
        #bottomWorlds .world span { position: absolute; left: 8px; bottom: 8px; color: #fff; background: rgba(0,0,0,0.55); padding: 2px 8px; font-size: 14px; }
        #worldOverlay { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; overflow: hidden; }
        #worldOverlayImg { width: 100%; height: 100%; object-fit: cover; }
        #worldDialog { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; min-width: 320px; max-width: 90vw; padding: 20px 24px; border-radius: 8px; z-index: 6; }
        #worldDialog h2 { margin: 0 0 12px; font-size: 18px; }
        #worldDialog button { display: block; width: 100%; margin: 6px 0; padding: 8px; cursor: pointer; }
        #sitGate {
            display: none;
            position: absolute;
            left: 50%;
            top: -20%;
            width: 23.4vmin;
            z-index: 3;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
        #sitGate.gateway { animation: freefallGimbal 5.6s cubic-bezier(0.16, 0.72, 0.18, 1) forwards; }
        #sitGate.blast {
            transition: top 1.15s cubic-bezier(0.22, 0.08, 0.25, 1),
                        left 1.15s cubic-bezier(0.22, 0.08, 0.25, 1),
                        transform 1.15s cubic-bezier(0.18, 0.7, 0.2, 1),
                        opacity 1.15s ease;
        }
        #sitGlow { position: absolute; inset: -18%; border-radius: 50%; filter: blur(18px); opacity: 0.35; mix-blend-mode: screen; }
        #sitCapsule { display: block; width: 100%; height: auto; transform-origin: center 70%; mix-blend-mode: soft-light; }
        #sitGate.settled #sitCapsule { mix-blend-mode: normal; }
        .zxcv-pad {
            position: absolute;
            width: 22vmin;
            height: 22vmin;
            z-index: 2;
            pointer-events: none;
            border: 1px dashed rgba(255,255,255,0.0);
            background-size: cover;
            background-position: center;
        }
        #pad-z { top: 0; left: 0; }
        #pad-x { top: 0; right: 0; }
        #pad-c { bottom: 0; left: 0; }
        #pad-v { bottom: 0; right: 0; }
        .zxcv-mark {
            display: none;
            position: absolute;
            z-index: 4;
            width: 48px;
            height: 48px;
            line-height: 48px;
            text-align: center;
            font: 700 22px Arial, sans-serif;
            color: #fff;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.65);
            border-radius: 6px;
            cursor: pointer;
        }
        .zxcv-mark.show { display: block; }
        #mark-z { top: 18px; left: 18px; }
        #mark-x { top: 18px; right: 18px; }
        #mark-c { bottom: 18px; left: 18px; }
        #mark-v { bottom: 18px; right: 18px; }
        @keyframes freefallGimbal {
            0% { top: -16%; width: 13vmin; opacity: 0.35; transform: translate(-50%, -50%) rotateX(53deg) rotateY(14deg) rotateZ(8deg) scale(0.62); }
            22% { top: 18%; width: 16.9vmin; opacity: 0.72; transform: translate(-50%, -50%) rotateX(44deg) rotateY(-11deg) rotateZ(-6deg) scale(0.78); }
            48% { top: 36%; width: 19.5vmin; opacity: 0.9; transform: translate(-50%, -50%) rotateX(30deg) rotateY(8deg) rotateZ(4deg) scale(0.92); }
            74% { top: 47%; width: 21.6vmin; opacity: 0.97; transform: translate(-50%, -50%) rotateX(20deg) rotateY(-3deg) rotateZ(-2deg) scale(1.02); }
            100% { top: 50%; width: 21.66vmin; opacity: 1; transform: translate(-50%, -50%) rotateX(16deg) rotateY(0deg) rotateZ(0deg) scale(1); }
        }
    </style>
</head>
<body>
    <h1>LIZARD ROMULUS — Enhanced System</h1>

    <section>
        <h2>Image Modifier</h2>
        <form id="modifierForm">
            <label>ETE:</label>
            <select id="image_select" name="image_select" required>
                <option value="AA">AA</option>
                <option value="BB">BB</option>
                <option value="CC">CC</option>
                <option value="DD">DD</option>
            </select>
            <div class="image-preview">
                <img id="image1" alt="Preview 1">
                <img id="image2" alt="Preview 2">
            </div>
            <label>Brightness:</label>
            <input type="number" id="brightness" name="brightness" step="0.1" value="1.0">
            <label>Contrast:</label>
            <input type="number" id="contrast" name="contrast" step="0.1" value="1.0">
            <label>Rotation (degrees):</label>
            <input type="number" id="rotation" name="rotation" step="1" value="0">
            <label>Rocket Size:</label>
            <input type="number" id="rocketSize" name="rocketSize" step="0.1" value="1.0">
            <button type="submit">HIBERNATION</button>
        </form>
        <img id="modifiedImage" alt="Modified Output">
    </section>
    <hr>

    <section>
        <h2>MISSION LOG</h2>
        <form id="missionForm">
            <label>Mission Name:</label>
            <input type="text" id="missionName" required>
            <label>Model Address:</label>
            <input type="text" id="modelAddress" required>
            <label>Server Log:</label>
            <input type="text" id="serverLog" required>
            <button type="submit">Submit Mission Log</button>
        </form>
        <div id="responseMessage"></div>
        <div id="missionDropdownContainer" style="display:none; margin-top:20px;">
            <label><strong>Select a planet topic:</strong></label><br>
            <select id="missionPlanetDropdown" style="width:250px;"></select>
        </div>
    </section>
    <hr>

    <section>
        <h2>ETE Planet Binding Preview</h2>
        <div style="display:flex; gap:20px; align-items:flex-start;">
            <img id="ETE" src="" alt="Bound Planet Preview">
            <div id="eteTextBoxContainer">
                <label id="eteTextLabel" style="font-weight:bold;">Enter data:</label><br>
                <textarea id="eteTextInput"></textarea>
                <button type="button" id="eteTextSubmit" style="margin-top:10px; width:100%;">Submit</button>
            </div>
        </div>
    </section>
    <hr>

    <section>
        <h2>IGNITION SEQUENCE</h2>
        <canvas id="rocketCanvas" width="800" height="600"></canvas>
    </section>
    <hr>

    <section id="keylockSection">
        <h2>EARTH MARS BLACK MOON — keylock</h2>
        <p>the letters
            <span class="erbm-key" data-key="e">e</span>
            <span class="erbm-key" data-key="r">r</span>
            <span class="erbm-key" data-key="b">b</span>
            <span class="erbm-key" data-key="m">m</span>
        </p>
        <label for="keylock">keylock</label><br>
        <input id="keylock" name="keylock" type="text" maxlength="1" placeholder="e r b m" autocomplete="off">
        <div id="bottomWorlds">
            <div class="world" data-key="e"><img alt="Earth"><span>EARTH — <span class="erbm-key" data-key="e">e</span></span></div>
            <div class="world" data-key="r"><img alt="Mars"><span>MARS — <span class="erbm-key" data-key="r">r</span></span></div>
            <div class="world" data-key="b"><img alt="Black"><span>BLACK — <span class="erbm-key" data-key="b">b</span></span></div>
            <div class="world" data-key="m"><img alt="Moon"><span>MOON — <span class="erbm-key" data-key="m">m</span></span></div>
        </div>
    </section>

    <div id="worldOverlay" aria-hidden="true">
        <img id="worldOverlayImg" alt="Selected world">
        <div class="zxcv-pad" id="pad-z" data-corner="z"></div>
        <div class="zxcv-pad" id="pad-x" data-corner="x"></div>
        <div class="zxcv-pad" id="pad-c" data-corner="c"></div>
        <div class="zxcv-pad" id="pad-v" data-corner="v"></div>
        <div id="sitGate">
            <div id="sitGlow"></div>
            <img id="sitCapsule" alt="sit capsule" src="sit.png">
        </div>
        <button type="button" class="zxcv-mark" id="mark-z" data-corner="z">Z</button>
        <button type="button" class="zxcv-mark" id="mark-x" data-corner="x">X</button>
        <button type="button" class="zxcv-mark" id="mark-c" data-corner="c">C</button>
        <button type="button" class="zxcv-mark" id="mark-v" data-corner="v">V</button>
        <div id="worldDialog">
            <h2 id="worldDialogTitle">What would you like to do xyz</h2>
            <button type="button" data-act="explore">Explore xyz</button>
            <button type="button" data-act="scan">Scan xyz</button>
            <button type="button" data-act="lock">Lock xyz</button>
            <button type="button" id="closeOverlay">Close</button>
        </div>
    </div>

    <script>
        const planetSources = [
            "https://4kwallpapers.com/images/wallpapers/planet-earth-orbit-outer-space-cosmos-1920x1200-8769.jpg",
            "https://th.bing.com/th/id/OIP.aBxMsTDueJ0OEYpqcoZb7wHaEK?w=326&h=183&c=7&r=0&o=5&dpr=1.5&pid=1.7",
            "https://th.bing.com/th/id/OIP.fI3DWs_H0Z6Man0THeWe6wHaEK?rs=1&pid=ImgDetMain",
            "https://th.bing.com/th/id/OIP.0nwjv9AEh1uLPs4RHKQu3QHaHa?rs=1&pid=ImgDetMain"
        ];
        const ROCKET_SRC = "https://raw.githubusercontent.com/AlienWare51/MoonWave/main/rocket.png";
        const LIZARD_SRC = "https://raw.githubusercontent.com/AlienWare51/MoonWave/main/lizard.png";
        const SIT_SRC_LOCAL = "sit.png";
        const SIT_SRC_FALLBACK = "https://raw.githubusercontent.com/AlienWare51/MoonWave/main/sit.png";

        const eteBinding = { AA: 0, BB: 1, CC: 2, DD: 3 };
        const worldMap = {
            e: { name: "Earth", src: planetSources[0] },
            r: { name: "Mars", src: planetSources[1] },
            b: { name: "Black", src: planetSources[2] },
            m: { name: "Moon", src: planetSources[3] }
        };
        const zxcvTargets = {
            z: { top: "10%", left: "10%", rot: "-28deg" },
            x: { top: "10%", left: "90%", rot: "28deg" },
            c: { top: "90%", left: "10%", rot: "-38deg" },
            v: { top: "90%", left: "90%", rot: "38deg" }
        };

        const imageSelect = document.getElementById("image_select");
        const canvas = document.getElementById("rocketCanvas");
        const ctx = canvas.getContext("2d");
        const keylock = document.getElementById("keylock");
        const responseMessage = document.getElementById("responseMessage");
        const modifiedImage = document.getElementById("modifiedImage");
        const worldOverlay = document.getElementById("worldOverlay");
        const worldOverlayImg = document.getElementById("worldOverlayImg");
        const worldDialog = document.getElementById("worldDialog");
        const worldDialogTitle = document.getElementById("worldDialogTitle");
        const sitGate = document.getElementById("sitGate");
        const sitGlow = document.getElementById("sitGlow");
        const sitCapsule = document.getElementById("sitCapsule");

        let rocketImg = new Image();
        let lizardImg = new Image();
        const planets = [];
        let landingTimer = null;
        let activeWorld = null;
        const sampleCanvas = document.createElement("canvas");
        const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

        function isWorldOpen() {
            return worldOverlay.style.display === "block";
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error("Failed to load " + src));
                img.src = src;
                if (img.complete && img.naturalWidth > 0) resolve(img);
            });
        }

        function selectedPlanetIndex() {
            return eteBinding[imageSelect.value] ?? 0;
        }

        function applyModifierPreview() {
            const src = planetSources[selectedPlanetIndex()];
            modifiedImage.src = src;
            modifiedImage.style.filter = `brightness(${document.getElementById("brightness").value}) contrast(${document.getElementById("contrast").value})`;
            modifiedImage.style.transform = `rotate(${document.getElementById("rotation").value}deg)`;
        }

        function updateEtePreview() {
            const i = selectedPlanetIndex();
            document.getElementById("ETE").src = planetSources[i];
            document.getElementById("image1").src = planetSources[i];
            document.getElementById("image2").src = planetSources[(i + 1) % 4];
            document.getElementById("eteTextBoxContainer").style.display = "block";
            document.getElementById("eteTextLabel").textContent = `Enter data for ${imageSelect.value}:`;
            applyModifierPreview();
            missionNameCallback();
        }

        function missionNameCallback() {
            const box = document.getElementById("missionDropdownContainer");
            if (imageSelect.value !== "BB" || !document.getElementById("eteTextInput").value.trim()) {
                box.style.display = "none";
                return;
            }
            const dropdown = document.getElementById("missionPlanetDropdown");
            dropdown.innerHTML = "";
            ["Mars", "Pluto", "Jupiter", "Saturn", "Venus"].forEach((name) => {
                const option = document.createElement("option");
                option.value = "https://en.wikipedia.org/wiki/" + name;
                option.textContent = name;
                dropdown.appendChild(option);
            });
            box.style.display = "block";
        }

        function renderFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const halfW = canvas.width / 2, halfH = canvas.height / 2;
            const q = [{ x: 0, y: 0 }, { x: halfW, y: 0 }, { x: 0, y: halfH }, { x: halfW, y: halfH }];
            Object.keys(eteBinding).forEach((k, i) => {
                if (planets[i]) ctx.drawImage(planets[i], q[i].x, q[i].y, halfW, halfH);
            });
            if (!rocketImg.naturalWidth || !lizardImg.naturalWidth) return;
            const size = parseFloat(document.getElementById("rocketSize").value) || 1;
            const rot = parseFloat(document.getElementById("rotation").value) || 0;
            const rw = Math.max(8, rocketImg.naturalWidth * size);
            const rh = Math.max(8, rocketImg.naturalHeight * size);
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(rot * Math.PI / 180);
            ctx.drawImage(rocketImg, -rw / 2, -rh / 2, rw, rh);
            ctx.globalAlpha = 0.5;
            ctx.drawImage(lizardImg, -rw / 2, -rh / 2, rw, rh);
            ctx.restore();
        }

        function sampleWorldColor() {
            const fallbacks = { e: [40, 90, 150], r: [160, 70, 40], b: [20, 20, 24], m: [130, 130, 140] };
            try {
                sampleCanvas.width = 24; sampleCanvas.height = 24;
                sampleCtx.drawImage(worldOverlayImg, 0, 0, 24, 24);
                const d = sampleCtx.getImageData(0, 0, 24, 24).data;
                let r = 0, g = 0, b = 0, n = 0;
                for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
                return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
            } catch (err) {
                return fallbacks[activeWorld] || fallbacks.e;
            }
        }

        function tintSitToWorld() {
            const [r, g, b] = sampleWorldColor();
            const wash = `rgba(${r},${g},${b},0.42)`;
            sitGlow.style.background = `radial-gradient(circle, ${wash}, transparent 70%)`;
            sitCapsule.style.filter = `contrast(1.04) saturate(1.12) drop-shadow(0 16px 18px rgba(${r},${g},${b},0.45))`;
        }

        function showZxcvMarks() {
            document.querySelectorAll(".zxcv-mark").forEach((el) => el.classList.add("show"));
        }
        function hideZxcvMarks() {
            document.querySelectorAll(".zxcv-mark").forEach((el) => el.classList.remove("show"));
        }

        function blastSitTo(corner) {
            const dest = zxcvTargets[corner];
            if (!dest || !isWorldOpen()) return;
            if (!sitGate.classList.contains("settled") || sitGate.classList.contains("blast")) return;
            hideZxcvMarks();
            sitGate.classList.add("blast");
            sitGate.style.top = dest.top;
            sitGate.style.left = dest.left;
            sitGate.style.transform = `translate(-50%, -50%) rotate(${dest.rot}) scale(0.42)`;
            sitGate.style.opacity = "0.2";
            console.log("blast on page", activeWorld, "to corner", corner);
        }

        function resetSit() {
            if (landingTimer) { clearTimeout(landingTimer); landingTimer = null; }
            hideZxcvMarks();
            sitGate.classList.remove("gateway", "settled", "blast");
            sitGate.style.display = "none";
            sitGate.style.width = "";
            sitGate.style.top = "";
            sitGate.style.left = "50%";
            sitGate.style.transform = "";
            sitGate.style.opacity = "";
        }

        function openWorld(letter) {
            const world = worldMap[letter];
            if (!world) return;
            activeWorld = letter;
            resetSit();
            worldOverlayImg.src = world.src;
            worldDialogTitle.textContent = `What would you like to do ${world.name}?`;
            worldDialog.style.display = "block";
            worldOverlay.style.display = "block";
            worldOverlay.setAttribute("aria-hidden", "false");
            keylock.value = letter;
        }

        function closeWorld() {
            resetSit();
            activeWorld = null;
            worldOverlay.style.display = "none";
            worldOverlay.setAttribute("aria-hidden", "true");
            worldDialog.style.display = "block";
        }

        function startExploreFreefall() {
            if (!isWorldOpen()) return;
            worldDialog.style.display = "none";
            tintSitToWorld();
            sitGate.style.display = "block";
            sitGate.style.left = "50%";
            sitGate.classList.remove("gateway", "settled", "blast");
            void sitGate.offsetWidth;
            sitGate.classList.add("gateway");

            landingTimer = setTimeout(() => {
                const host = Math.min(worldOverlay.clientWidth, worldOverlay.clientHeight);
                sitGate.classList.remove("gateway");
                sitGate.classList.add("settled");
                sitGate.style.top = "50%";
                sitGate.style.left = "50%";
                sitGate.style.width = ((host / 6) * 1.3) + "px";
                sitGate.style.transform = "translate(-50%, -50%) rotateX(16deg)";
                sitCapsule.style.mixBlendMode = "normal";
                showZxcvMarks();
            }, 5600);
        }

        function myFunction(event) {
            if (isWorldOpen()) return;
            let letter = "";
            if (event.currentTarget && event.currentTarget.classList && event.currentTarget.classList.contains("erbm-key")) {
                letter = event.currentTarget.getAttribute("data-key");
            } else if (event.target === keylock) {
                letter = String(keylock.value).trim().toLowerCase().slice(-1);
            } else {
                letter = String(event.key || "").toLowerCase();
            }
            if (!worldMap[letter]) return;
            if (event.target && event.target.id !== "keylock") {
                if (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA" || event.target.tagName === "SELECT") return;
            }
            if (event.preventDefault) event.preventDefault();
            openWorld(letter);
        }

        imageSelect.addEventListener("change", updateEtePreview);
        document.getElementById("eteTextSubmit").addEventListener("click", missionNameCallback);
        document.getElementById("modifierForm").addEventListener("submit", (e) => { e.preventDefault(); applyModifierPreview(); renderFrame(); });
        ["brightness", "contrast", "rotation", "rocketSize"].forEach((id) => {
            document.getElementById(id).addEventListener("input", () => { applyModifierPreview(); renderFrame(); });
        });
        document.getElementById("missionForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            missionNameCallback();
            responseMessage.textContent = "Saved locally: " + document.getElementById("missionName").value;
        });
        document.getElementById("missionPlanetDropdown").addEventListener("change", () => {
            const url = document.getElementById("missionPlanetDropdown").value;
            if (url) window.open(url, "_blank");
        });

        document.addEventListener("click", (event) => {
            const span = event.target.closest(".erbm-key");
            if (span && !isWorldOpen()) myFunction({ currentTarget: span, target: span, preventDefault() {} });
        });
        keylock.addEventListener("input", myFunction);

        document.addEventListener("keydown", (event) => {
            if (event.repeat) return;
            if (event.key === "Escape") { closeWorld(); return; }
            const letter = String(event.key || "").toLowerCase();
            if (isWorldOpen()) {
                if ("zxcv".includes(letter) && sitGate.classList.contains("settled")) {
                    event.preventDefault();
                    blastSitTo(letter);
                }
                return;
            }
            if (event.target && (event.target.tagName === "TEXTAREA" || (event.target.tagName === "INPUT" && event.target.id !== "keylock"))) return;
            myFunction(event);
        });

        document.querySelectorAll("#bottomWorlds .world").forEach((el) => {
            el.querySelector("img").src = worldMap[el.dataset.key].src;
            el.addEventListener("click", (event) => {
                if (event.target.closest(".erbm-key")) return;
                openWorld(el.dataset.key);
            });
        });
        document.querySelectorAll(".zxcv-mark").forEach((btn) => {
            btn.addEventListener("click", () => blastSitTo(btn.dataset.corner));
        });
        document.getElementById("closeOverlay").addEventListener("click", closeWorld);
        document.querySelectorAll("#worldDialog button[data-act]").forEach((btn) => {
            btn.addEventListener("click", () => {
                if (btn.getAttribute("data-act") === "explore") startExploreFreefall();
                else closeWorld();
            });
        });
        sitCapsule.addEventListener("error", () => {
            if (sitCapsule.src.indexOf(SIT_SRC_FALLBACK) === -1) sitCapsule.src = SIT_SRC_FALLBACK;
        });

        Promise.all([
            ...planetSources.map((src) => loadImage(src).catch(() => null)),
            loadImage(ROCKET_SRC),
            loadImage(LIZARD_SRC),
            loadImage(SIT_SRC_LOCAL).catch(() => loadImage(SIT_SRC_FALLBACK).catch(() => null))
        ]).then((loaded) => {
            loaded.slice(0, 4).forEach((img, i) => { planets[i] = img; });
            rocketImg = loaded[4];
            lizardImg = loaded[5];
            if (loaded[6]) sitCapsule.src = loaded[6].src;
            updateEtePreview();
            renderFrame();
            setInterval(renderFrame, 250);
        });
    </script>
</body>
</html>
